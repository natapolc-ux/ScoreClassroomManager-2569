<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Matrix Student System</title>

<style>

body{
  margin:0;
  overflow-x:hidden;
  background:black;
  color:#00ff41;
  font-family:monospace;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

.login-box{
  width:320px;
  margin:100px auto;
  background:rgba(0,0,0,0.88);
  border:1px solid #00ff41;
  padding:22px;
  box-shadow:0 0 20px #00ff41;
}

.panel{
  display:none;
  padding:20px;
  max-width:1100px;
  margin:auto;
}

input,
select,
button{
  width:100%;
  box-sizing:border-box;
  margin-top:10px;
  padding:11px;
  background:black;
  color:#00ff41;
  border:1px solid #00ff41;
  font-family:monospace;
}

button{
  cursor:pointer;
}

button:hover{
  background:#00ff41;
  color:black;
}

h2,h3,h4{
  text-shadow:0 0 8px #00ff41;
}

.toolbar{
  display:grid;
  grid-template-columns:140px 1fr 2fr 1fr 1fr 48px;
  gap:10px;
  margin-bottom:10px;
  align-items:stretch;
}

.toolbar > button,
.toolbar > select,
.toolbar > input,
.toolbar .gear-button{
  height:46px;
  min-height:46px;
  margin-top:0;
}

.toolbar-button{
  margin-top:10px;
}
.settings-wrap{
  position:relative;
  display:flex;
  align-items:stretch;
}

.gear-button{
  width:48px;
  min-width:48px;
  font-size:20px;
  text-align:center;
}

.settings-popup{
  display:none;
  position:absolute;
  right:0;
  top:58px;
  width:300px;
  z-index:999;
  padding:14px;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.96);
  box-shadow:0 0 18px #00ff41;
}

.settings-popup.show{
  display:block;
}

.settings-title{
  font-weight:bold;
  margin-bottom:8px;
  text-shadow:0 0 8px #00ff41;
}

.settings-popup label{
  display:block;
  margin-top:10px;
}

.settings-popup select,
.settings-popup button{
  width:100%;
}
.status-box{
  margin-top:15px;
  padding:12px;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.88);
}

.card{
  position:relative;
  border:1px solid #00ff41;
  margin:20px 0;
  padding:20px;
  background:rgba(17,17,17,0.96);
  box-shadow:0 0 15px #00ff41;
}

.meta{
  line-height:1.7;
}
.score-tools{
  display:none;
  margin-top:15px;
  padding:12px;
  border:1px dashed #00ff41;
  background:rgba(0,0,0,0.75);
}

.score-tools-row{
  display:grid;
  grid-template-columns:1.45fr 1fr 1fr 1fr 1fr 1fr 48px;
  gap:10px;
  margin-top:10px;
  align-items:stretch;
}

.hide-score-box{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.hide-score-box input{
  width:auto;
  margin-top:0;
}

.score-input{
  width:170px;
  min-width:170px;
  min-height:43px;
  text-align:center;
}

.changed-score{
  border:2px solid #ffd43b !important;
  box-shadow:0 0 8px #ffd43b;
}

.hidden-score{
  display:inline-block;
  padding:4px 10px;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.8);
  letter-spacing:3px;
}
.work-box{
  margin-top:16px;
  padding:14px;
  border:1px dashed #00ff41;
  background:rgba(0,0,0,0.72);
}

.text-work{
  white-space:pre-wrap;
  line-height:1.7;
  word-break:break-word;
}

.drive-preview{
  width:100%;
  max-width:620px;
  height:520px;
  border:1px solid #00ff41;
  background:#000;
  display:block;
  margin-top:10px;
}

.direct-image{
  width:100%;
  max-width:620px;
  max-height:520px;
  object-fit:contain;
  border:1px solid #00ff41;
  background:#000;
  display:block;
  margin-top:10px;
}

.file-link{
  display:inline-block;
  margin-top:10px;
  padding:8px 12px;
  border:1px solid #00ff41;
  color:#00ff41;
  text-decoration:none;
}

.file-link:hover{
  background:#00ff41;
  color:#000;
}

.score-area{
  margin-top:18px;
}

.work-card-actions{
  position:absolute;
  top:10px;
  right:10px;
  display:flex;
  gap:8px;
  z-index:5;
}

.work-card-actions button{
  width:auto;
  min-width:90px;
  margin-top:0;
  padding:7px 10px;
  font-size:13px;
}

.score-area{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:18px;
}

.score-area input{
  width:120px;
  margin-top:0;
}

.score-area button{
  width:auto;
  margin-top:0;
}

.empty-text{
  opacity:0.9;
}
.submit-time{
  display:inline-block;
  margin-top:8px;
  padding:8px 12px;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.75);
}

.normal-time{
  border:1px solid #00ff41;
}

.late-time{
  border:1px solid #ff3b3b;
  background:#8b0000;
  color:#ffffff;
  box-shadow:0 0 10px #ff3b3b;
}

.late-label{
  display:inline-block;
  margin-left:8px;
  padding:3px 8px;
  border-radius:999px;
  background:#ff3b3b;
  color:#ffffff;
  font-weight:bold;
}

.due-date{
  margin-top:6px;
  font-size:0.95em;
  opacity:0.95;
}
.panel-divider{
  border:0;
  border-top:1px solid #00ff41;
  margin:40px 0 30px;
}

.score-toolbar{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}

.score-table-wrap{
  margin-top:15px;
  overflow-x:auto;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.88);
}

.score-table{
  width:100%;
  min-width:900px;
  border-collapse:collapse;
}

.score-table th,
.score-table td{
  border:1px solid #00ff41;
  padding:10px;
  text-align:center;
  vertical-align:middle;
  white-space:nowrap;
}

.score-table th{
  background:rgba(0,255,65,0.12);
}

.score-table td.student-name{
  text-align:left;
  min-width:180px;
}

.score-value{
  font-weight:bold;
  font-size:1.05em;
}

.score-pending{
  display:inline-block;
  padding:4px 8px;
  border:1px solid #ffd43b;
  color:#ffd43b;
}

.score-missing{
  display:inline-block;
  padding:4px 8px;
  border:1px solid #ff3b3b;
  background:#8b0000;
  color:#fff;
}

.score-error{
  display:inline-block;
  padding:4px 8px;
  border:1px solid #ff9800;
  color:#ffcc80;
}  
@media(max-width:700px){
  .toolbar{
    grid-template-columns:1fr;
  }
.score-tools-row{
  grid-template-columns:1fr;
}
.score-toolbar{
  grid-template-columns:1fr;
}
  .login-box{
    width:auto;
    margin:70px 20px;
  }

  .drive-preview{
    height:420px;
  }
  .settings-popup{
    position:static;
    width:100%;
    margin-top:10px;
  }
}
.work-status{
  display:inline-block;
  margin-top:10px;
  margin-bottom:10px;
  padding:6px 14px;
  border-radius:999px;
  font-weight:bold;
}

.submitted-status{
  background:#006b2d;
  color:#ffffff;
  border:1px solid #00ff41;
  box-shadow:0 0 8px #00ff41;
}

.missing-status{
  background:#8b0000;
  color:#ffffff;
  border:1px solid #ff3b3b;
  box-shadow:0 0 10px #ff3b3b;
}
.score-late{
  display:inline-block;
  margin-top:5px;
  padding:4px 8px;
  border:1px solid #ff3b3b;
  background:#8b0000;
  color:#ffffff;
  box-shadow:0 0 8px #ff3b3b;
  font-weight:bold;
}
.select-score-box{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.select-score-box input[type="checkbox"]{
  width:auto;
  margin-top:0;
}

.selected-score-cell{
  outline:2px solid #ffd43b;
  box-shadow:0 0 8px #ffd43b;
}
.assignment-header{
  min-width:190px;
  vertical-align:top;
}

.assignment-title-button{
  width:100%;
  margin-top:0;
  padding:7px 8px;
  white-space:normal;
  line-height:1.35;
}

.full-score-box{
  margin-top:6px;
  font-size:12px;
  opacity:0.95;
}

.full-score-input{
  width:80px !important;
  margin-top:4px !important;
  padding:6px !important;
  text-align:center;
}

.bulk-score-hint{
  padding:11px;
  border:1px dashed #00ff41;
  background:rgba(0,0,0,0.7);
  line-height:1.5;
}

.refresh-work-button{
  display:none;
}

.score-input.score-late-input{
  border-color:#ff9800 !important;
  background:#3a2400;
  color:#ffcc80;
  box-shadow:0 0 8px #ff9800;
}

.score-input::placeholder{
  color:#ffcc80;
  opacity:1;
}

.score-cell-display,
.score-missing,
.score-error{
  min-height:43px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  box-sizing:border-box;
}

.assignment-title-button.selected-assignment{
  background:#00ff41;
  color:#000;
  box-shadow:0 0 10px #00ff41;
}

.score-check-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
}


.score-tools-row > button,
.score-tools-row > input,
.score-tools-row .score-gear-button{
  height:46px;
  min-height:46px;
  margin-top:0;
}

.score-settings-wrap{
  position:relative;
  display:flex;
  align-items:stretch;
}

.score-gear-button{
  width:48px;
  min-width:48px;
  font-size:20px;
  text-align:center;
}

.score-settings-popup{
  display:none;
  position:absolute;
  right:0;
  top:58px;
  width:320px;
  z-index:999;
  padding:14px;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.96);
  box-shadow:0 0 18px #00ff41;
}

.score-settings-popup.show{
  display:block;
}

.score-export-row{
  display:none;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.score-export-row .score-export-button{
  display:block;
  width:100%;
}

.score-input.locked-score-input{
  opacity:0.92;
  border-style:dashed;
  cursor:not-allowed;
}

.score-input.status-background::placeholder{
  white-space:normal;
  text-overflow:clip;
}

.student-worksheet-box{
  margin-top:12px;
}

.my-worksheet-toggle{
  width:auto;
  margin-top:12px;
}


.student-announcement{
  border-color:#ffd43b;
  box-shadow:0 0 10px #ffd43b;
}

.student-announcement ul{
  margin:8px 0 0 18px;
  padding:0;
  line-height:1.8;
}

.student-announcement button,
.student-toc button{
  width:auto;
  margin-top:0;
  padding:4px 8px;
  text-align:left;
  border:1px solid transparent;
  background:transparent;
  color:#00ff41;
  cursor:pointer;
}

.student-announcement button:hover,
.student-toc button:hover{
  border-color:#00ff41;
  background:#00ff41;
  color:#000;
}

.student-toc{
  margin-top:15px;
  border-color:#00ff41;
}

.student-toc-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px;
}

.student-toc button.active{
  background:#00ff41;
  color:#000;
  box-shadow:0 0 8px #00ff41;
}

.overdue-label{
  display:inline-block;
  padding:2px 8px;
  margin-right:6px;
  border:1px solid #ff9800;
  background:#3a2400;
  color:#ffcc80;
  font-weight:bold;
}

.student-work-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
}

.student-work-actions button{
  width:auto;
  margin-top:0;
}

.student-submit-modal,
.custom-confirm-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:5000;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.82);
  padding:20px;
}

.student-submit-dialog,
.custom-confirm-dialog{
  position:relative;
  width:min(680px, 96vw);
  max-height:90vh;
  overflow:auto;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.98);
  box-shadow:0 0 22px #00ff41;
  padding:20px;
}

.student-submit-dialog textarea{
  width:100%;
  min-height:120px;
  margin-top:10px;
  background:black;
  color:#00ff41;
  border:1px solid #00ff41;
  font-family:monospace;
  box-sizing:border-box;
}

.student-submit-actions,
.custom-confirm-actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.student-submit-actions button,
.custom-confirm-actions button{
  width:50%;
}

.student-delete-button{
  position:absolute;
  top:10px;
  right:10px;
  width:auto !important;
  min-width:42px;
  margin-top:0;
  padding:7px 10px;
  color:#ffffff;
  border-color:#ff3b3b;
  background:#8b0000;
  box-shadow:0 0 8px #ff3b3b;
  z-index:10;
}

.student-delete-button:hover{
  background:#ff3b3b;
  color:#ffffff;
}


.group-assessment-box{
  display:none;
  margin-top:12px;
  padding:12px;
  border:1px dashed #00ff41;
  background:rgba(0,0,0,0.72);
}

.group-assessment-row{
  margin-top:10px;
  padding:10px;
  border:1px solid rgba(0,255,65,0.45);
}

.group-assessment-options{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:8px;
}

.group-assessment-options label{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:0;
}

.group-assessment-options input{
  width:auto;
  margin-top:0;
}

.teacher-note-textarea{
  width:100%;
  min-height:80px;
  margin-top:10px;
  background:black;
  color:#00ff41;
  border:1px solid #00ff41;
  font-family:monospace;
  box-sizing:border-box;
}

.teacher-only-box{
  margin-top:10px;
  padding:10px;
  border:1px dashed #ffd43b;
  color:#ffd43b;
  background:rgba(0,0,0,0.68);
}

.teacher-only-box ul{
  margin:8px 0 0 18px;
  padding:0;
  line-height:1.7;
}

.group-score-stack{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.individual-adjust-input{
  width:120px;
  min-height:35px;
  text-align:center;
  margin-top:0;
  color:#ffd43b;
  border-color:#ffd43b;
}

.group-final-score{
  font-size:12px;
  color:#ffd43b;
  line-height:1.4;
}

.group-contribution-note{
  font-size:12px;
  line-height:1.4;
  color:#ffcc80;
  max-width:170px;
  white-space:normal;
}

.group-score-readonly,
.final-score-input{
  width:120px;
  min-height:35px;
  text-align:center;
  margin-top:0;
}

.group-score-readonly{
  border-style:dashed;
  opacity:0.92;
  cursor:not-allowed;
}

.final-score-input{
  color:#00ff41;
  border-color:#00ff41;
}

.individual-adjust-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.group-contribution-status-badge{
  max-width:170px;
  padding:3px 7px;
  border:1px solid #ffcc80;
  color:#ffcc80;
  background:rgba(58,36,0,0.65);
  font-size:12px;
  line-height:1.35;
  white-space:normal;
}


.student-shell{
  display:grid;
  grid-template-columns:260px minmax(0, 1fr);
  gap:16px;
  align-items:start;
}

.student-sidebar{
  position:sticky;
  top:12px;
  max-height:calc(100vh - 24px);
  overflow:auto;
}

.student-sidebar .student-toc{
  margin-top:0;
}

.student-main{
  min-width:0;
}

.student-profile-card{
  display:flex;
  align-items:center;
  gap:14px;
}

.student-photo{
  width:86px;
  height:86px;
  object-fit:cover;
  border:1px solid #00ff41;
  box-shadow:0 0 10px #00ff41;
  background:#000;
  flex:0 0 auto;
}

.student-photo-small{
  width:62px;
  height:62px;
  object-fit:cover;
  border:1px solid #00ff41;
  box-shadow:0 0 8px #00ff41;
  background:#000;
  flex:0 0 auto;
}

.teacher-work-heading{
  display:flex;
  align-items:center;
  gap:12px;
  padding-right:190px;
}

.teacher-work-heading h3{
  margin:0;
}

.student-order-badge{
  display:inline-block;
  margin-top:6px;
  padding:3px 8px;
  border:1px solid #00ff41;
  background:rgba(0,255,65,0.08);
}

.contribution-disclaimer{
  margin-top:8px;
  font-size:12px;
  color:#ffcc80;
  line-height:1.4;
}

.individual-adjust-input::placeholder{
  color:#ffcc80;
  opacity:1;
}

@media(max-width:900px){
  .student-shell{
    grid-template-columns:1fr;
  }

  .student-sidebar{
    position:static;
    max-height:none;
  }

  .teacher-work-heading{
    padding-right:0;
  }
}


.topic-multi-select{
  height:46px !important;
  min-height:46px !important;
}

.assignment-class-checkbox-list{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));
  gap:8px;
  margin-top:8px;
}

.assignment-class-checkbox-list label{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:0;
  padding:7px 9px;
  border:1px solid rgba(0,255,65,0.55);
  background:rgba(0,0,0,0.45);
}

.assignment-class-checkbox-list input{
  width:auto;
  margin-top:0;
}

.revision-box{
  display:none;
  margin-top:12px;
  padding:12px;
  border:1px dashed #ffd43b;
  background:rgba(58,36,0,0.55);
  color:#ffcc80;
}

.revision-note-textarea{
  width:100%;
  min-height:80px;
  margin-top:10px;
  background:black;
  color:#00ff41;
  border:1px solid #ffd43b;
  font-family:monospace;
  box-sizing:border-box;
}

.teacher-worksheet-box{
  margin-top:12px;
  border-color:#ffd43b;
}

.returned-badge,
.revised-badge{
  display:inline-block;
  margin-top:6px;
  padding:4px 9px;
  border:1px solid #ff9800;
  background:#3a2400;
  color:#ffcc80;
  font-weight:bold;
}

.work-card-actions{
  flex-wrap:wrap;
  justify-content:flex-end;
  max-width:360px;
}

.work-card-actions button{
  min-width:86px;
}

.teacher-shell{
  display:grid;
  grid-template-columns:260px minmax(0, 1fr);
  gap:16px;
  align-items:start;
}

.teacher-sidebar{
  position:sticky;
  top:12px;
  max-height:calc(100vh - 24px);
  overflow:auto;
}

.teacher-sidebar button{
  text-align:left;
}

.teacher-sidebar button.active{
  background:#00ff41;
  color:#000;
  box-shadow:0 0 10px #00ff41;
}

.teacher-main{
  min-width:0;
}

.teacher-page{
  display:none;
}

.teacher-page.active{
  display:block;
}

.assignment-settings-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(290px, 1fr));
  gap:14px;
  margin-top:14px;
}

.assignment-setting-card h4{
  margin-top:0;
  line-height:1.45;
}

.assignment-setting-card label{
  display:block;
  margin-top:10px;
}

.assignment-setting-card select{
  min-height:105px;
}

.assignment-command-toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:end;
}

.assignment-command-toolbar button{
  width:auto;
  min-width:120px;
}

.assignment-worksheet-box{
  display:block;
  margin-top:10px;
  border-color:#ffd43b;
}

.teacher-work-bulk-tools{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;

<script>

// ใช้ API URL เดิมของคุณ
const API_URL =
  "https://script.google.com/macros/s/AKfycbz2zbVkttAPciPTjNIGDOVi0doD_cmhPqYgeZY5dIOAK_9WCxa3_2i9TwL9BlAmFjm1mg/exec";

let currentWorkData = [];
let currentSheetUrl = "";
let autoRefreshWorkTimer = null;
let autoRefreshWorkEnabled = false;
let currentStudentId = "";
let currentStudentName = "";
let currentStudentLevel = "";
let currentStudentClass = "";
let currentStudentNo = "";
let currentStudentPhotoUrl = "";
let currentStudentOrder = "";
let scoreOptionsData = [];
let teacherTopicsData = [];
let lastScoreTableData = null;
let hideScoreValues = true;
let lockScoredScores = true;
let hideIndividualAdjustments = false;
let changedScoreMap = {};
let selectedAssignmentIndexes = new Set();
let hideViewedWorksEnabled = false;
let currentMyWorkData = [];
let selectedMyWorkIndex = null;
let currentSubmitWorkItem = null;
let lastSelectedWorkUrls = [];
let selectedTeacherWorkKeys = new Set();

const VIEWED_WORKS_STORAGE_KEY = "matrixViewedWorks";
const HIDE_VIEWED_STORAGE_KEY = "matrixHideViewedWorks";
const COLLAPSED_WORKS_STORAGE_KEY = "matrixCollapsedWorks";
const FULL_SCORE_STORAGE_KEY_PREFIX = "matrixFullScore::";
const LOCK_SCORED_STORAGE_KEY = "matrixLockScoredScores";
const HIDE_SCORES_STORAGE_KEY = "matrixHideScores";
const HIDE_INDIVIDUAL_ADJUSTMENTS_STORAGE_KEY = "matrixHideIndividualAdjustments";

// ======================================
// LOGIN
// ======================================
function login(){

  const id = document
    .getElementById("id")
    .value
    .trim();

  const pass = document
    .getElementById("pass")
    .value
    .trim();

  const msg = document.getElementById("msg");

  if(!id || !pass){
    msg.innerHTML = "❌ กรุณากรอก ID และ Password";
    return;
  }

  msg.innerHTML = "กำลังเข้าสู่ระบบ...";

  fetch(
    API_URL
    + "?action=login"
    + "&id=" + encodeURIComponent(id)
    + "&pass=" + encodeURIComponent(pass)
  )

  .then(res => res.json())

  .then(data => {

    if(data.status === "success"){

      document
        .getElementById("loginBox")
        .style.display = "none";

      if(String(data.role).trim() === "teacher"){

        document
          .getElementById("teacherPanel")
          .style.display = "block";

        loadTopics();
        loadScoreOptions();
        loadHideViewedWorksSetting();
        loadScoreTableSettings();
      }

      else{

currentStudentId = data.id;
currentStudentName = data.name;
currentStudentLevel = data.level || "";
currentStudentClass = data.className || "";
currentStudentNo = data.no || "";
currentStudentPhotoUrl = data.photoUrl || "";
currentStudentOrder = data.studentOrder || calculateStudentOrder(currentStudentClass, currentStudentNo);

  document
    .getElementById("studentPanel")
    .style.display = "block";

  document
    .getElementById("studentData")
    .innerHTML =
    `<div class="status-box student-profile-card">
      ${renderStudentPhoto(currentStudentPhotoUrl, data.name, false)}
      <div>
        <div>ยินดีต้อนรับ ${escapeHtml(data.name)}</div>
      </div>
    </div>`;

  loadMyWork();
  loadSubmitTopics();
}
    }

    else{
      msg.innerHTML =
        "❌ " + escapeHtml(data.message || "Login Failed");
    }
  })

  .catch(error => {
    console.error(error);
    msg.innerHTML = "❌ เชื่อมต่อ API ไม่สำเร็จ";
  });
}



function calculateStudentOrder(className, no){

  const classText = String(className || "").trim();
  const noText = String(no || "").trim();

  const numbers = classText.match(/\d+/g) || [];
  const grade = numbers.length > 0 ? numbers[0] : "";
  const room = numbers.length > 1 ? numbers[1] : "";

  if(!grade || !room || !noText){
    return "";
  }

  const roomPadded = String(parseInt(room, 10)).padStart(2, "0");
  const noPadded = String(parseInt(noText, 10)).padStart(2, "0");

  if(roomPadded === "NaN" || noPadded === "NaN"){
    return "";
  }

  return String(parseInt(grade, 10)) + roomPadded + noPadded;
}

function getWorkStudentOrder(item){

  return String(
    item.studentOrder ||
    item.studentSeq ||
    calculateStudentOrder(item.class, item.no) ||
    "99999"
  );
}

function renderStudentPhoto(photoUrl, name, small){

  const url = String(photoUrl || "").trim();

  if(!url){
    return "";
  }

  const driveId =
    extractDriveFileId(url);

  const src =
    driveId
      ? "https://drive.google.com/thumbnail?id=" + driveId + "&sz=w240"
      : url;

  return `
    <img
      class="${small ? "student-photo-small" : "student-photo"}"
      src="${escapeAttribute(src)}"
      alt="รูปนักเรียน ${escapeAttribute(name || "")}" 
      onerror="this.style.display='none';"
    >
  `;
}


function switchTeacherPage(page){

  const pages = {
    assignment: "teacherPageAssignment",
    check: "teacherPageCheck",
    score: "teacherPageScore"
  };

  const navs = {
    assignment: "teacherNavAssignment",
    check: "teacherNavCheck",
    score: "teacherNavScore"
  };

  Object.keys(pages).forEach(key => {
    const section = document.getElementById(pages[key]);
    const button = document.getElementById(navs[key]);

    if(section){
      section.classList.toggle("active", key === page);
    }

    if(button){
      button.classList.toggle("active", key === page);
    }
  });

  if(page === "assignment"){
    renderAssignmentSettingsList();
  }
}


function populateAssignmentLevelFilter(topics){

  const select =
    document.getElementById("assignmentLevelFilter");

  if(!select){
    return;
  }

  const oldValue =
    String(select.value || "").trim();

  const levels = [
    ...new Set(
      (Array.isArray(topics) ? topics : [])
        .map(item => String(item.level || "").trim())
        .filter(Boolean)
    )
  ].sort((a, b) =>
    String(a).localeCompare(String(b), "th", { numeric: true })
  );

  let html =
    `<option value="">ทุกระดับชั้น</option>`;

  levels.forEach(level => {
    html += `
      <option value="${escapeAttribute(level)}">
        ${escapeHtml(level)}
      </option>
    `;
  });

  select.innerHTML = html;

  if(oldValue && levels.includes(oldValue)){
    select.value = oldValue;
  }
}


function getClassesForAssignmentLevel(level){

  const found =
    (Array.isArray(scoreOptionsData) ? scoreOptionsData : [])
      .find(item =>
        normalizeOptionKey(item.level) === normalizeOptionKey(level)
      );

  return found && Array.isArray(found.classes)
    ? found.classes
    : [];
}


function renderAssignmentClassOptionsForCard(topic, index){

  const classes =
    getClassesForAssignmentLevel(topic.level);

  const assigned =
    parseClassList(topic.assignedClasses || "");

  if(classes.length === 0){
    return `
      <div class="empty-text">
        ยังไม่พบข้อมูลห้องของระดับชั้นนี้
      </div>
    `;
  }

  return `
    <div
      id="assignmentClasses_${index}"
      class="assignment-class-checkbox-list"
    >
      ${classes.map(className => `
        <label>
          <input
            type="checkbox"
            value="${escapeAttribute(className)}"
            data-assignment-class-index="${escapeAttribute(index)}"
            ${assigned.includes(className) ? "checked" : ""}
          >
          ${escapeHtml(className)}
        </label>
      `).join("")}
    </div>
    <div class="empty-text">
      ไม่ติ๊กห้อง = สั่งงานทุกห้องในระดับชั้นนี้
    </div>
  `;
}


function renderAssignmentSettingsList(){

  const box =
    document.getElementById("assignmentSettingsList");

  const status =
    document.getElementById("assignmentSettingsStatus");

  if(!box){
    return;
  }

  const topics =
    Array.isArray(teacherTopicsData)
      ? teacherTopicsData
      : [];

  const levelFilter =
    document.getElementById("assignmentLevelFilter");

  const selectedLevel =
    levelFilter ? String(levelFilter.value || "").trim() : "";

  const filteredTopics =
    topics
      .map((topic, index) => ({ topic, index }))
      .filter(item =>
        !selectedLevel ||
        String(item.topic.level || "").trim() === selectedLevel
      );

  if(status){
    status.innerHTML = "";
  }

  if(topics.length === 0){
    box.innerHTML =
      `<div class="status-box">ยังไม่มีหัวข้องาน</div>`;
    return;
  }

  if(filteredTopics.length === 0){
    box.innerHTML =
      `<div class="status-box">ไม่พบงานของระดับชั้นที่เลือก</div>`;
    return;
  }

  box.innerHTML = `
    <div class="assignment-settings-grid">
      ${filteredTopics.map(({ topic, index }) => {
        const worksheetUrl =
          String(topic.worksheetUrl || "").trim();

        const worksheetId =
          "assignmentWorksheet_" + index;

        return `
          <div class="card assignment-setting-card">
            <h4>
              ${escapeHtml(topic.level || "-")}
              -
              ${escapeHtml(topic.topic || "-")}
              ${topic.workType ? `<span class="student-order-badge">${escapeHtml(topic.workType)}</span>` : ``}
            </h4>

            <label>คะแนนเต็มของงาน</label>
            <input
              id="assignmentFullScore_${index}"
              type="number"
              value="${escapeAttribute(topic.fullScore || "")}"
              placeholder="เช่น 10"
            >

            <label>สั่งงานเฉพาะห้อง</label>
            ${renderAssignmentClassOptionsForCard(topic, index)}

            <div class="student-work-actions">
              <button
                type="button"
                onclick="saveAssignmentSettingsFromCard(${index})"
              >
                บันทึกการตั้งค่า
              </button>

              ${
                worksheetUrl
                ? `
                  <button
                    type="button"
                    onclick="toggleAssignmentWorksheet('${escapeJsString(worksheetId)}', this)"
                  >
                    ซ่อนใบคำสั่งงาน
                  </button>
                `
                : ``
              }
            </div>

            ${
              worksheetUrl
              ? `
                <div
                  id="${escapeAttribute(worksheetId)}"
                  class="work-box assignment-worksheet-box"
                >
                  <h4>ใบคำสั่งงาน</h4>
                  ${renderWorksheetContent(worksheetUrl)}

              `
              : `<div class="empty-text">ยังไม่ได้ใส่ลิงก์ใบคำสั่งงาน</div>`
            }

        `;

}


function getSelectedAssignmentClassesFromCard(index){

  return Array.from(
    document.querySelectorAll(
      `[data-assignment-class-index="${String(index)}"]:checked`
    )
  )
    .map(input => String(input.value || "").trim())
    .filter(Boolean);
}


function saveAssignmentSettingsFromCard(index){

  const topic =
    (Array.isArray(teacherTopicsData) ? teacherTopicsData : [])[index];

  if(!topic || !topic.url){
    alert("ไม่พบข้อมูลงานที่ต้องการบันทึก");
    return;
  }

  const fullScoreInput =
    document.getElementById("assignmentFullScore_" + index);

  const fullScore =
    fullScoreInput ? String(fullScoreInput.value || "").trim() : "";

  const assignedClasses =
    getSelectedAssignmentClassesFromCard(index);

  fetch(API_URL + "?action=updateAssignmentSettings", {
    method: "POST",
    body: JSON.stringify({
      url: topic.url,
      fullScore: fullScore,
      assignedClasses: assignedClasses
    })
  })
  .then(res => res.json())
  .then(response => {

    if(response.status !== "success"){
      alert("❌ " + (response.message || "บันทึกการตั้งค่างานไม่สำเร็จ"));
      return;
    }

    topic.fullScore = fullScore;
    topic.assignedClasses = assignedClasses.join(",");

    alert("✅ บันทึกการตั้งค่างานแล้ว");
    renderAssignmentSettingsList();
    renderWorkTopicOptions();
  })
  .catch(error => {
    console.error(error);
    alert("❌ เชื่อมต่อ API ไม่สำเร็จ");
  });
}


function toggleAssignmentWorksheet(id, button){

  const box =
    document.getElementById(id);

  if(!box){
    return;
  }

  const isHidden =
    window.getComputedStyle(box).display === "none";

  box.style.display = isHidden ? "block" : "none";

  if(button){
    button.textContent = isHidden ? "ซ่อนใบคำสั่งงาน" : "เปิดใบคำสั่งงาน";
  }
}

function loadTopics(){

  const topicSelect = document.getElementById("topic");
  const levelSelect = document.getElementById("workLevelFilter");

  if(levelSelect){
    levelSelect.innerHTML =
      `<option value="">กำลังโหลดระดับชั้น...</option>`;
  }

  topicSelect.innerHTML =
    `<option value="">กำลังโหลดหัวข้องาน...</option>`;

  fetch(API_URL + "?action=topics")

  .then(res => res.json())

  .then(response => {

    let topics = [];

    // รองรับ API เวอร์ชันใหม่
    if(
      response &&
      response.status === "success" &&
      Array.isArray(response.data)
    ){
      topics = response.data;
    }

    // รองรับ API เก่าที่ยังส่ง array ตรง ๆ
    else if(Array.isArray(response)){
      topics = response;
    }

    else{
      if(levelSelect){
        levelSelect.innerHTML =
          `<option value="">ทุกระดับชั้น</option>`;
      }

      topicSelect.innerHTML =
        `<option value="">โหลดหัวข้องานไม่สำเร็จ</option>`;

      console.log("Topics API Response:", response);
      return;
    }

    teacherTopicsData = topics;

    if(topics.length === 0){
      if(levelSelect){
        levelSelect.innerHTML =
          `<option value="">ทุกระดับชั้น</option>`;
      }

      topicSelect.innerHTML =
        `<option value="">ยังไม่มีหัวข้องาน</option>`;
      return;
    }

    populateWorkLevelFilter(topics);
    populateAssignmentLevelFilter(topics);
    renderWorkTopicOptions();
    renderAssignmentSettingsList();
    updateWorkClassFilterByTopic();
  })

  .catch(error => {
    console.error(error);

    if(levelSelect){
      levelSelect.innerHTML =
        `<option value="">ทุกระดับชั้น</option>`;
    }

    topicSelect.innerHTML =
      `<option value="">โหลดหัวข้องานไม่สำเร็จ</option>`;
  });
}


function populateWorkLevelFilter(topics){

  const levelSelect =
    document.getElementById("workLevelFilter");

  if(!levelSelect){
    return;
  }

  const oldValue =
    String(levelSelect.value || "").trim();

  const levels = [
    ...new Set(
      (Array.isArray(topics) ? topics : [])
        .map(item => String(item.level || "").trim())
        .filter(Boolean)
    )
  ].sort((a, b) =>
    String(a).localeCompare(String(b), "th", { numeric: true })
  );

  let html =
    `<option value="">ทุกระดับชั้น</option>`;

  levels.forEach(level => {
    html += `
      <option value="${escapeAttribute(level)}">
        ${escapeHtml(level)}
      </option>
    `;
  });

  levelSelect.innerHTML = html;

  if(oldValue && levels.includes(oldValue)){
    levelSelect.value = oldValue;
  }
}


function getSelectedWorkLevel(){

  const levelSelect =
    document.getElementById("workLevelFilter");

  return levelSelect
    ? String(levelSelect.value || "").trim()
    : "";
}


function getTopicMetaByUrl(url){

  const target =
    String(url || "").trim();

  return (Array.isArray(teacherTopicsData) ? teacherTopicsData : [])
    .find(item => String(item.url || "").trim() === target) || null;
}

function parseClassList(value){

  if(Array.isArray(value)){
    return value.map(item => String(item || "").trim()).filter(Boolean);
  }

  return String(value || "")
    .split(/[,\n|\/]+/)
    .map(item => item.trim())
    .filter(Boolean);
}

function getSelectedTopicOptions(){

  const topicSelect =
    document.getElementById("topic");

  if(!topicSelect){
    return [];
  }

  return Array.from(topicSelect.selectedOptions || [])
    .filter(option => String(option.value || "").trim() !== "");
}

function getSelectedAssignmentTopics(){

  return getSelectedTopicOptions()
    .filter(option => option.value !== "__ALL_WORK__")
    .map(option => getTopicMetaByUrl(option.value) || {
      url: option.value,
      level: option.getAttribute("data-level") || getSelectedWorkLevel(),
      topic: option.textContent || "",
      workType: option.getAttribute("data-work-type") || "งานเดี่ยว"
    })
    .filter(topic => topic && topic.url);
}

function applyAssignmentMetaToRow(row, topic){

  topic = topic || getTopicMetaByUrl(row && row.sheetUrl);

  return {
    ...row,
    level: topic && topic.level ? topic.level : (row.level || ""),
    topic: topic && topic.topic ? topic.topic : (row.topic || ""),
    sheetUrl: topic && topic.url ? topic.url : (row.sheetUrl || ""),
    workType: topic && topic.workType ? topic.workType : (row.workType || "งานเดี่ยว"),
    worksheetUrl: topic && topic.worksheetUrl !== undefined ? topic.worksheetUrl : (row.worksheetUrl || ""),
    worksheetVisible: topic && topic.worksheetVisible !== undefined ? topic.worksheetVisible : row.worksheetVisible,
    fullScore: topic && topic.fullScore !== undefined ? topic.fullScore : (row.fullScore || ""),
    assignedClasses: topic && topic.assignedClasses !== undefined ? topic.assignedClasses : (row.assignedClasses || "")
  };
}

function getSelectedTopicUrl(){

  const options =
    getSelectedTopicOptions();

  const normalOptions =
    options.filter(option => option.value !== "__ALL_WORK__");

  return normalOptions.length === 1
    ? normalOptions[0].value
    : "";
}

function renderAssignedClassOptions(){

  const select =
    document.getElementById("assignedClassSelect");

  if(!select){
    return;
  }

  const selectedUrl =
    getSelectedTopicUrl();

  const selectedTopic =
    selectedUrl ? getTopicMetaByUrl(selectedUrl) : null;

  const selectedLevel =
    selectedTopic && selectedTopic.level
      ? selectedTopic.level
      : getSelectedWorkLevel();

  let classes = [];

  if(selectedLevel && Array.isArray(scoreOptionsData)){
    const levelData = scoreOptionsData.find(item =>
      normalizeOptionKey(item.level) === normalizeOptionKey(selectedLevel)
    );

    if(levelData && Array.isArray(levelData.classes)){
      classes = levelData.classes;
    }
  }

  const assigned =
    parseClassList(selectedTopic ? selectedTopic.assignedClasses : "");

  if(!selectedTopic){
    select.innerHTML = `<option value="">เลือกงานเดี่ยว 1 งานก่อน</option>`;
    return;
  }

  select.innerHTML = classes.map(className => `
    <option
      value="${escapeAttribute(className)}"
      ${assigned.includes(className) ? "selected" : ""}
    >
      ${escapeHtml(className)}
    </option>
  `).join("");
}

function getSelectedAssignedClasses(){

  const select =
    document.getElementById("assignedClassSelect");

  if(!select){
    return [];
  }

  return Array.from(select.selectedOptions || [])
    .map(option => String(option.value || "").trim())
    .filter(Boolean);
}

function saveAssignmentClassSettings(){

  const selectedUrl =
    getSelectedTopicUrl();

  if(!selectedUrl){
    alert("กรุณาเลือกงานเพียง 1 งานก่อนบันทึกห้องที่สั่งงาน");
    return;
  }

  const topic =
    getTopicMetaByUrl(selectedUrl);

  const classes =
    getSelectedAssignedClasses();

  fetch(API_URL + "?action=updateAssignmentSettings", {
    method: "POST",
    body: JSON.stringify({
      url: selectedUrl,
      fullScore: topic ? (topic.fullScore || "") : "",
      assignedClasses: classes
    })
  })
  .then(res => res.json())
  .then(response => {
    if(response.status !== "success"){
      alert("❌ " + (response.message || "บันทึกห้องที่สั่งงานไม่สำเร็จ"));
      return;
    }

    if(topic){
      topic.assignedClasses = classes.join(",");
    }

    alert("✅ บันทึกห้องที่สั่งงานแล้ว");
  })
  .catch(error => {
    console.error(error);
    alert("❌ เชื่อมต่อ API ไม่สำเร็จ");
  });
}


function renderWorkTopicOptions(keepTopicValue){

  const topicSelect =
    document.getElementById("topic");

  if(!topicSelect){
    return;
  }

  const selectedLevel =
    getSelectedWorkLevel();

  const currentTopic =
    keepTopicValue !== undefined
      ? String(keepTopicValue || "")
      : String(topicSelect.value || "");

  const topics =
    (Array.isArray(teacherTopicsData) ? teacherTopicsData : [])
      .filter(item =>
        !selectedLevel ||
        String(item.level || "").trim() === selectedLevel
      );

  const allWorkLabel =
    selectedLevel
      ? "📚 โหลดทุกงานของ " + selectedLevel
      : "📚 โหลดทุกงานทุกชั้น";

  let html =
    `<option value="">-- เลือกหัวข้องาน --</option>
     <option
       value="__ALL_WORK__"
       data-level="${escapeAttribute(selectedLevel)}"
       data-work-type="all"
     >
       ${escapeHtml(allWorkLabel)}
     </option>`;

  topics.forEach(t => {

html += `
  <option
    value="${escapeAttribute(t.url)}"
    data-level="${escapeAttribute(t.level || "")}"
    data-work-type="${escapeAttribute(t.workType || "งานเดี่ยว")}"
  >
    ${escapeHtml(t.topic || "")}
    ${t.workType === "งานกลุ่ม" ? " [งานกลุ่ม]" : ""}
    ${t.workType === "เลือกส่ง" ? " [เลือกส่ง]" : ""}
  </option>
`;
  });

  topicSelect.innerHTML = html;

  if(currentTopic){
    const hasCurrentTopic =
      Array.from(topicSelect.options)
        .some(option => option.value === currentTopic);

    if(hasCurrentTopic){
      topicSelect.value = currentTopic;
    }
  }

  renderAssignedClassOptions();
}


function handleWorkLevelFilterChange(){

  renderWorkTopicOptions("");

  const classSelect =
    document.getElementById("classFilter");

  if(classSelect){
    classSelect.value = "";
  }

  updateWorkClassFilterByTopic();
}

function normalizeOptionKey(value){
  return String(value || "")
    .trim()
    .replace(/\s+/g, "")
    .replace(/\./g, "")
    .toLowerCase();
}
function updateWorkClassFilterByTopic(keepClassValue){

  const topicSelect =
    document.getElementById("topic");

  const classSelect =
    document.getElementById("classFilter");

  const noFilter =
    document.getElementById("noFilter");

  if(!topicSelect || !classSelect){
    return;
  }

  const selectedOption =
    topicSelect.options[topicSelect.selectedIndex];

  const selectedLevelFromTopic =
    selectedOption
      ? String(selectedOption.getAttribute("data-level") || "").trim()
      : "";

  const selectedLevel =
    selectedLevelFromTopic || getSelectedWorkLevel();

  const oldClassValue =
    keepClassValue !== undefined
      ? String(keepClassValue || "").trim()
      : String(classSelect.value || "").trim();

  let classes = [];

  if(selectedLevel && Array.isArray(scoreOptionsData)){

    const foundLevel =
      scoreOptionsData.find(item =>
        normalizeOptionKey(item.level) === normalizeOptionKey(selectedLevel)
      );

    if(foundLevel && Array.isArray(foundLevel.classes)){
      classes = foundLevel.classes;
    }
  }

  let html =
    `<option value="">ทุกห้อง</option>`;

  classes.forEach(className => {
    html += `
      <option value="${escapeAttribute(className)}">
        ${escapeHtml(className)}
      </option>
    `;
  });

  classSelect.innerHTML = html;

  if(oldClassValue){
    const hasOldClass =
      Array.from(classSelect.options)
        .some(option => option.value === oldClassValue);

    if(hasOldClass){
      classSelect.value = oldClassValue;
    }
  }

  classSelect.onchange = renderWorkCards;

  if(noFilter){
    noFilter.oninput = renderWorkCards;
  }

  renderAssignedClassOptions();
}

function loadWork(){

  const selectedOptions =
    getSelectedTopicOptions();

  const selectedClassBeforeLoad =
    document.getElementById("classFilter").value;

  const workBox =
    document.getElementById("work");

  const workStatus =
    document.getElementById("workStatus");

  if(selectedOptions.length === 0){
    workStatus.innerHTML =
      `<div class="status-box">❌ กรุณาเลือกหัวข้องานก่อน</div>`;
    workBox.innerHTML = "";
    return;
  }

  if(selectedOptions[0].value === "__ALL_WORK__"){
    loadAllWork();
    return;
  }

  const topic =
    getTopicMetaByUrl(selectedOptions[0].value) || getSelectedAssignmentTopics()[0];

  if(!topic || !topic.url){
    workStatus.innerHTML =
      `<div class="status-box">❌ กรุณาเลือกหัวข้องานก่อน</div>`;
    workBox.innerHTML = "";
    return;
  }

  const url =
    String(topic.url || "").trim();

  currentSheetUrl = url;
  selectedTeacherWorkKeys.clear();

  const refreshButton =
    document.getElementById("refreshWorkButton");

  if(refreshButton){
    refreshButton.style.display = "block";
  }

  workStatus.innerHTML =
    `<div class="status-box">กำลังโหลดงาน...</div>`;

  workBox.innerHTML = "";

  fetch(
    API_URL
    + "?action=studentWork"
    + "&url="
    + encodeURIComponent(url)
    + "&hideChecked="
    + encodeURIComponent(hideViewedWorksEnabled ? "true" : "false")
  )

  .then(res => res.json())

  .then(response => {

    let data = [];

    if(
      response &&
      response.status === "success" &&
      Array.isArray(response.data)
    ){
      data = response.data;
    }

    else if(Array.isArray(response)){
      data = response;
    }

    else{
      workStatus.innerHTML =
        `<div class="status-box">
          ❌ โหลดงานไม่สำเร็จ:
          ${escapeHtml(response.message || "รูปแบบข้อมูลจาก API ไม่ถูกต้อง")}
        </div>`;

      console.log("StudentWork API Response:", response);
      return;
    }

    currentWorkData = data.map(item =>
      applyAssignmentMetaToRow({
        ...item,
        sheetUrl: item.sheetUrl || url
      }, topic)
    );

    applyDefaultCollapsedForCheckedWorks(currentWorkData);

    if(currentWorkData.length === 0){

      workStatus.innerHTML =
        `<div class="status-box">ยังไม่มีข้อมูลงานนักเรียนในชีทนี้</div>`;

      return;
    }

    updateWorkClassFilterByTopic(selectedClassBeforeLoad);

    workStatus.innerHTML =
      `<div class="status-box">
        พบงานทั้งหมด ${currentWorkData.length} รายการ
      </div>`;

    applyWorkSortAndRender();
  })

  .catch(error => {

    console.error(error);

    workStatus.innerHTML =
      `<div class="status-box">
        ❌ เกิดข้อผิดพลาดในการเชื่อมต่อ API
      </div>`;
  });
}


function loadSelectedWorkTopics(topics){

  const workBox =
    document.getElementById("work");

  const workStatus =
    document.getElementById("workStatus");

  const refreshButton =
    document.getElementById("refreshWorkButton");

  currentSheetUrl = "";
  currentWorkData = [];
  selectedTeacherWorkKeys.clear();

  if(refreshButton){
    refreshButton.style.display = "block";
  }

  workBox.innerHTML = "";
  workStatus.innerHTML =
    `<div class="status-box">กำลังโหลดงานที่เลือก ${topics.length} งาน...</div>`;

  const requests =
    topics.map(topic => {
      return fetch(
        API_URL
        + "?action=studentWork"
        + "&url=" + encodeURIComponent(topic.url)
        + "&hideChecked=" + encodeURIComponent(hideViewedWorksEnabled ? "true" : "false")
      )
      .then(res => res.json())
      .then(result => {
        const rows =
          result && result.status === "success" && Array.isArray(result.data)
            ? result.data
            : [];

        return rows.map(row =>
          applyAssignmentMetaToRow({
            ...row,
            sheetUrl: topic.url || row.sheetUrl || ""
          }, topic)
        );
      })
      .catch(error => {
        console.error(error);
        return [];
      });
    });

  Promise.all(requests)
    .then(groups => {

      currentWorkData =
        groups.flat();

      applyDefaultCollapsedForCheckedWorks(currentWorkData);

      if(currentWorkData.length === 0){
        workStatus.innerHTML =
          `<div class="status-box">ไม่พบงานที่ต้องตรวจในงานที่เลือก</div>`;
        workBox.innerHTML = "";
        return;
      }

      populateClassFilter(currentWorkData);

      workStatus.innerHTML =
        `<div class="status-box">
          พบงานทั้งหมด ${currentWorkData.length} รายการ จากงานที่เลือก ${topics.length} งาน
        </div>`;

      applyWorkSortAndRender();
    })
    .catch(error => {
      console.error(error);
      workStatus.innerHTML =
        `<div class="status-box">❌ โหลดงานที่เลือกไม่สำเร็จ</div>`;
    });
}

          API_URL
          + "?action=studentWork"
          + "&url=" + encodeURIComponent(topic.url)
          + "&hideChecked=" + encodeURIComponent(hideViewedWorksEnabled ? "true" : "false")
        )
        .then(res => res.json())
        .then(result => {
          const rows =
            result && result.status === "success" && Array.isArray(result.data)
              ? result.data
              : [];

          return rows.map(row => ({
            ...row,
            level: topic.level || row.level || "",
            topic: topic.topic || row.topic || "",
            sheetUrl: topic.url || row.sheetUrl || "",
            workType: topic.workType || row.workType || "งานเดี่ยว",
            worksheetUrl: topic.worksheetUrl !== undefined ? topic.worksheetUrl : (row.worksheetUrl || ""),
            worksheetVisible: topic.worksheetVisible !== undefined ? topic.worksheetVisible : row.worksheetVisible,
            fullScore: topic.fullScore !== undefined ? topic.fullScore : (row.fullScore || ""),
            assignedClasses: topic.assignedClasses !== undefined ? topic.assignedClasses : (row.assignedClasses || "")
          }));
        })
        .catch(error => {
          console.error(error);
          return [];
        });
      });

      return Promise.all(requests);
    })
    .then(groups => {

      if(!groups){
        return;
      }

      currentWorkData = groups.flat();
      applyDefaultCollapsedForCheckedWorks(currentWorkData);

      if(currentWorkData.length === 0){
        workStatus.innerHTML =
          `<div class="status-box">ไม่พบงานที่ต้องตรวจ</div>`;
        workBox.innerHTML = "";
        return;
      }

      populateClassFilter(currentWorkData);

      const selectedLevel =
        getSelectedWorkLevel();

      workStatus.innerHTML =
        `<div class="status-box">
          พบงานทั้งหมด ${currentWorkData.length} รายการ
          ${selectedLevel ? "ของ " + escapeHtml(selectedLevel) : "จากทุกชั้น"}
        </div>`;

      applyWorkSortAndRender();
    })
    .catch(error => {
      console.error(error);
      workStatus.innerHTML =
        `<div class="status-box">❌ โหลดทุกงานไม่สำเร็จ</div>`;
    });
}

function getSortedWorkData(data){

  const sortSelect =
    document.getElementById("workSortMode");

  const sortMode =
    sortSelect ? sortSelect.value : "latest";

  const sorted =
    [...data];

  sorted.sort((a, b) => {

    if(sortMode === "latest"){
      return getTimeValue(b.timestamp) - getTimeValue(a.timestamp);
    }

    if(sortMode === "oldest"){
      return getTimeValue(a.timestamp) - getTimeValue(b.timestamp);
    }

    if(sortMode === "noAsc" || sortMode === "noDesc"){
      const aIsGroup = isGroupWorkItem(a);
      const bIsGroup = isGroupWorkItem(b);

      if(aIsGroup !== bIsGroup){
        return aIsGroup ? 1 : -1;
      }

      return sortMode === "noAsc"
        ? getNoValue(a.no) - getNoValue(b.no)
        : getNoValue(b.no) - getNoValue(a.no);
    }

    if(sortMode === "studentSeqAsc"){
      return getWorkStudentOrder(a)
        .localeCompare(
          getWorkStudentOrder(b),
          "th",
          { numeric: true }
        );
    }

    if(sortMode === "groupAsc"){
      return getGroupDisplayName(a)
        .localeCompare(
          getGroupDisplayName(b),
          "th",
          { numeric: true }
        );
    }

    return 0;
  });

  return sorted;
}


function getTimeValue(value){

  const time =
    new Date(value).getTime();

  return isNaN(time) ? 0 : time;
}


function getNoValue(value){

  const number =
    parseInt(value, 10);

  return isNaN(number) ? 999999 : number;
}


function isGroupWorkItem(item){

  return item.isGroup === true ||
    String(item.submitMode || "").trim() === "งานกลุ่ม" ||
    String(item.groupName || "").trim() !== "";
}


function getStudentDisplayName(item){

  return String(
    item.name ||
    item.studentName ||
    ""
  ).trim();
}


function getGroupDisplayName(item){

  if(isGroupWorkItem(item)){
    return String(item.groupName || "").trim();
  }

  return "\uffff";
}

  }
}


function saveViewedWorksMap(map){

  localStorage.setItem(

    JSON.stringify(map || {})
  );
}


function getWorkViewedKey(rowIndex, sheetUrl){

  return String(sheetUrl || currentSheetUrl || "") + "::" + String(rowIndex || "");
}


function markWorkAsViewed(rowIndex, sheetUrl){

  if(!rowIndex){
    return;
  }

  const map =
    getViewedWorksMap();

  map[getWorkViewedKey(rowIndex, sheetUrl)] = true;

  saveViewedWorksMap(map);
}


function getCollapsedWorksMap(){

  try {
    return JSON.parse(
      localStorage.getItem(COLLAPSED_WORKS_STORAGE_KEY) || "{}"
    );
  } catch(error) {
    return {};
  }
}


function saveCollapsedWorksMap(map){

  localStorage.setItem(
    COLLAPSED_WORKS_STORAGE_KEY,
    JSON.stringify(map || {})
  );
}


function getCollapsedWorkKey(rowIndex, sheetUrl){

  return String(sheetUrl || currentSheetUrl || "") + "::" + String(rowIndex || "");
}


function applyDefaultCollapsedForCheckedWorks(data){

  const map =
    getCollapsedWorksMap();

  let changed = false;

  (Array.isArray(data) ? data : []).forEach(item => {

    if(
      item &&
      item.rowIndex &&
      hasScoreValue(item.score)
    ){
      const key =
        getCollapsedWorkKey(item.rowIndex, item.sheetUrl);

      if(map[key] !== true){
        map[key] = true;
        changed = true;
      }
    }
  });

  if(changed){
    saveCollapsedWorksMap(map);
  }
}


function isWorkCollapsed(item){

  const map =
    getCollapsedWorksMap();

  const key =
    getCollapsedWorkKey(item.rowIndex, item.sheetUrl);

  if(Object.prototype.hasOwnProperty.call(map, key)){
    return map[key] === true;
  }

  return hasScoreValue(item.score);
}


function setWorkCollapsed(rowIndex, collapsed, sheetUrl){

  if(!rowIndex){
    return;
  }

  const map =
    getCollapsedWorksMap();

  map[getCollapsedWorkKey(rowIndex, sheetUrl)] =
    collapsed === true;

  saveCollapsedWorksMap(map);

  renderWorkCards();
}


function markWorkAsViewedAndHide(rowIndex){

  markWorkAsViewed(rowIndex);
  setWorkCollapsed(rowIndex, true);
}


function hasScoreValue(score){

  return score !== "" &&
    score !== null &&
    score !== undefined &&
    String(score).trim() !== "";
}


function isWorkViewedOrChecked(item){

  if(hasScoreValue(item.score)){
    return true;
  }

  const map =
    getViewedWorksMap();

  return map[getWorkViewedKey(item.rowIndex)] === true;
}

  }

    prompt("หมายเหตุส่งงานคืนให้นักเรียนแก้ไข", "");

  if(note === null){
    return;
  }

  fetch(API_URL + "?action=returnSubmission", {
    method: "POST",
    body: JSON.stringify({
      url: url,
      rowIndex: rowIndex,
      workType: workType || "งานเดี่ยว",
      returnNote: note
    })

  .then(res => res.json())
  .then(response => {

      alert("❌ " + (response.message || "ส่งงานคืนไม่สำเร็จ"));

function getTeacherWorkSelectionKey(item){

  return [
    String(item.sheetUrl || currentSheetUrl || "").trim(),
    String(item.rowIndex || "").trim(),
    String(item.id || "").trim()
  ].join("|");
}

function toggleTeacherWorkSelected(checkbox){

  const key =
    String(checkbox.value || "").trim();

  if(!key){
    return;
  }

  if(checkbox.checked){
    selectedTeacherWorkKeys.add(key);
  } else {
    selectedTeacherWorkKeys.delete(key);
  }

  const card =
    checkbox.closest(".card");

  if(card){
    card.classList.toggle("teacher-work-selected", checkbox.checked);
  }

  updateTeacherWorkSelectionStatus();
}

function updateTeacherWorkSelectionStatus(){

  const box =
    document.getElementById("teacherWorkSelectionStatus");

  if(!box){
    return;
  }

  box.textContent =
    "เลือกใบงานนักเรียน " + selectedTeacherWorkKeys.size + " รายการ";

    selectedTeacherWorkKeys.add(String(check.value || ""));

    const card = check.closest(".card");
    if(card){
      card.classList.add("teacher-work-selected");

  updateTeacherWorkSelectionStatus();

function clearSelectedTeacherWorks(){

  selectedTeacherWorkKeys.clear();

  document.querySelectorAll(".teacher-work-select").forEach(check => {
    check.checked = false;
    const card = check.closest(".card");
    if(card){
      card.classList.remove("teacher-work-selected");

function returnSelectedSubmissionsForRevision(){

  const selectedItems =
    getSelectedTeacherWorkItems()
      .filter(item => item.sheetUrl && item.rowIndex);

  if(selectedItems.length === 0){
    alert("กรุณาติ๊กเลือกใบงานนักเรียนก่อน");
    return;
  }

  const note =
    prompt("หมายเหตุส่งงานคืนให้นักเรียนแก้ไข", "");

  if(note === null){
    return;
  }

  const confirmed =
    confirm("ยืนยันส่งงานคืน " + selectedItems.length + " รายการหรือไม่");

  if(!confirmed){
    return;
  }

  Promise.all(
    selectedItems.map(item =>
      fetch(API_URL + "?action=returnSubmission", {
        method: "POST",
        body: JSON.stringify({
          url: item.sheetUrl,
          rowIndex: item.rowIndex,
          workType: item.workType || (isGroupWorkItem(item) ? "งานกลุ่ม" : "งานเดี่ยว"),
          returnNote: note
        })

      .then(response => ({ item, response }))
      .catch(error => ({ item, response: { status: "error", message: error.message } }))

      results.filter(result => !result.response || result.response.status !== "success");

    refreshWorkList();

                ย่อแผ่นงานแล้ว กด “แสดงงาน” เพื่อดูงานที่ส่งและให้คะแนน
              </p>
            </div>
          `
          : `
            <div class="work-box">
              <h4>งานที่ส่ง</h4>
              ${renderWorkContent(workValue)}
            </div>

            <div class="score-area">

              <input
                type="number"
                id="score_${escapeAttribute(s.rowIndex || s.id)}"
                value="${scoreText === "ตรวจแล้ว" ? "" : escapeAttribute(s.score || "")}"
                placeholder="คะแนน"
              >

              <button
                onclick="saveScore(
                  '${escapeJsString(itemSheetUrl)}',
                  '${escapeJsString(s.id || "")}',
                  '${escapeJsString(s.rowIndex || "")}'
                )"
              >
                บันทึกคะแนน
              </button>

              <button
                type="button"
                onclick="markCheckedNoScore(
                  '${escapeJsString(itemSheetUrl)}',
                  '${escapeJsString(s.id || "")}',
                  '${escapeJsString(s.rowIndex || "")}'
                )"
              >
                ตรวจแล้ว แต่ยังไม่ให้คะแนน
              </button>

              <button
                type="button"
                onclick="giveFullScore(
                  '${escapeJsString(itemSheetUrl)}',
                  '${escapeJsString(s.id || "")}',
                  '${escapeJsString(s.rowIndex || "")}'
                )"
              >
                คะแนนเต็ม
              </button>

            </div>
          `
        }

      </div>
    `;
  });

  if(visibleCount === 0){
    html =
      `<div class="status-box">ไม่พบข้อมูลตามตัวกรอง</div>`;
  }

  const selectionToolbar = visibleCount > 0
    ? `
      <div class="status-box teacher-work-bulk-tools">
        <button type="button" onclick="selectAllVisibleTeacherWorks()">
          เลือกใบงานที่แสดงทั้งหมด
        </button>
        <button type="button" onclick="clearSelectedTeacherWorks()">
          ยกเลิกการเลือก
        </button>
        <button type="button" onclick="returnSelectedSubmissionsForRevision()">
          ส่งคืนงานที่เลือก
        </button>
        <span id="teacherWorkSelectionStatus" class="teacher-work-selection-status"></span>
      </div>
    `
    : "";

  workBox.innerHTML = selectionToolbar + html;
  updateTeacherWorkSelectionStatus();
}
// ======================================
// แสดงงานในช่อง Work
// ถ้าเป็น Drive URL = พรีวิวไฟล์
// ถ้าเป็น image URL โดยตรง = แสดงรูป
// ถ้าเป็น URL ทั่วไป = แสดงลิงก์
// ถ้าไม่ใช่ URL = แสดงข้อความ
// ======================================
function renderWorkContent(work){

  const value = String(work || "").trim();

  if(!value){
    return `<p class="empty-text">ยังไม่มีข้อมูลงานที่ส่ง</p>`;
  }

  const driveFileId = extractDriveFileId(value);

  if(driveFileId){

    const previewUrl =
      "https://drive.google.com/file/d/"
      + driveFileId
      + "/preview";

    return `
      <iframe
        class="drive-preview"
        src="${escapeAttribute(previewUrl)}"
        allow="autoplay"
      ></iframe>

      <a
        class="file-link"
        href="${escapeAttribute(value)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        เปิดไฟล์ในแท็บใหม่
      </a>
    `;
  }

  if(isDirectImageUrl(value)){

    return `
      <img
        class="direct-image"
        src="${escapeAttribute(value)}"
        alt="Student work"
        onerror="this.outerHTML='<p>❌ ไม่สามารถแสดงรูปได้</p>';"
      >
    `;
  }

  if(isUrl(value)){

    return `
      <a
        class="file-link"
        href="${escapeAttribute(value)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        เปิดลิงก์งาน
      </a>
    `;
  }

  return `
    <div class="text-work">
      ${escapeHtml(value)}
    </div>
  `;
}


// ======================================
// บันทึกคะแนน
// ======================================
function saveScore(url, studentId, rowIndex){

  const inputId =
    "score_" + (rowIndex || studentId);

  const scoreInput =
    document.getElementById(inputId);

  if(!scoreInput){
    alert("ไม่พบช่องกรอกคะแนน");
    return;
  }

  const score = scoreInput.value;

  if(score === ""){
    alert("กรุณากรอกคะแนน หรือกดปุ่ม ตรวจแล้ว แต่ยังไม่ให้คะแนน");
    return;
  }

  saveScoreValue(
    url,
    studentId,
    rowIndex,
    score,
    "✅ บันทึกคะแนนแล้ว"
  );
}

function saveScoreValue(url, studentId, rowIndex, score, successMessage){

  fetch(
    API_URL
    + "?action=updateScore"
    + "&url=" + encodeURIComponent(url)
    + "&studentId=" + encodeURIComponent(studentId)
    + "&rowIndex=" + encodeURIComponent(rowIndex)
    + "&score=" + encodeURIComponent(score)
  )

  .then(res => res.json())

  .then(data => {

    if(data.status === "success"){

      markWorkAsViewed(rowIndex, url);
      setWorkCollapsed(rowIndex, true, url);

      alert(successMessage || "✅ บันทึกแล้ว");

      refreshWorkList();
    }

    else{
      alert("❌ " + (data.message || "บันทึกไม่สำเร็จ"));
    }
  })

  .catch(error => {
    console.error(error);
    alert("❌ เชื่อมต่อ API ไม่สำเร็จ");
  });
}

function markCheckedNoScore(url, studentId, rowIndex){

  saveScoreValue(
    url,
    studentId,
    rowIndex,
    "ตรวจแล้ว",
    "✅ บันทึกสถานะตรวจแล้วเรียบร้อย"
  );
}

function giveFullScore(url, studentId, rowIndex){

  const storageKey =
    FULL_SCORE_STORAGE_KEY_PREFIX + String(url || "");

  const topicInfo =
    Array.isArray(teacherTopicsData)
      ? teacherTopicsData.find(item => String(item.url || "") === String(url || ""))
      : null;

  const oldFullScore =
    localStorage.getItem(storageKey) ||
    (topicInfo && topicInfo.fullScore ? String(topicInfo.fullScore) : "") ||
    "10";

  const fullScore =
    prompt("กรอกคะแนนเต็มของงานนี้", oldFullScore);

  if(fullScore === null){
    return;
  }

  const cleanedScore =
    String(fullScore || "").trim();

  if(cleanedScore === ""){
    alert("กรุณากรอกคะแนนเต็ม");
    return;
  }

  localStorage.setItem(storageKey, cleanedScore);

  if(topicInfo){
    topicInfo.fullScore = cleanedScore;
  }

  fetch(API_URL + "?action=updateAssignmentFullScore", {
    method: "POST",
    body: JSON.stringify({
      url: url,
      fullScore: cleanedScore
    })
  }).catch(error => console.error(error));

  saveScoreValue(
    url,
    studentId,
    rowIndex,
    cleanedScore,
    "✅ ให้คะแนนเต็มแล้ว"
  );
}

// ======================================
// แยก FILE ID จากลิงก์ Google Drive
// รองรับ:
// - open?id=...
// - /file/d/.../view
// - uc?id=...
// ======================================
function extractDriveFileId(url){

  const value = String(url || "").trim();

  const matchById =
    value.match(/[?&]id=([a-zA-Z0-9_-]+)/);

  if(matchById && matchById[1]){
    return matchById[1];
  }

  const matchByD =
    value.match(/\/d\/([a-zA-Z0-9_-]+)/);

  if(matchByD && matchByD[1]){
    return matchByD[1];
  }

  return "";
}


// ======================================
// ตรวจ URL
// ======================================
function isUrl(value){
  return /^https?:\/\/\S+$/i.test(String(value || "").trim());
}


// ======================================
// ตรวจ direct image url
// ======================================
function isDirectImageUrl(value){
  return /^https?:\/\/\S+\.(png|jpg|jpeg|gif|webp|bmp|svg)(\?\S*)?$/i
    .test(String(value || "").trim());
}


// ======================================
// ป้องกัน HTML แตก
// ======================================
function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttribute(value){
  return escapeHtml(value);
}

function escapeJsString(value){

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\"')
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");
}
// ======================================
// จัดรูปแบบวันและเวลาส่งงาน
// ======================================
function formatTimestamp(value){

  if(!value){
    return "-";
  }

  const date = new Date(value);

  if(isNaN(date.getTime())){
    return String(value);
  }

  return new Intl.DateTimeFormat("th-TH", {
    timeZone: "Asia/Bangkok",
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  }).format(date);
}

// แสดงรายการงานของนักเรียน
// ทั้ง "ส่งแล้ว" และ "ยังไม่ได้ส่ง"
// ======================================
function renderMyWorkCards(data){

  const workBox =
    document.getElementById("myWork");

  const allData =
    Array.isArray(data)
    ? data
    : [];

  currentMyWorkData = allData;

  let html = "";

  const missingItems =
    allData
      .map((item, index) => ({ item, index }))
      .filter(entry => entry.item.status !== "submitted");

  if(missingItems.length > 0){
    html += `
      <div class="status-box student-announcement">
        <h3>ป้ายประกาศงานที่ยังไม่ได้ส่ง</h3>
        <ul>
          ${missingItems.map(entry => `
            <li>
              <button
                type="button"
                onclick="showSingleMyWork(${entry.index})"
                title="กดเพื่อดูงานนี้"
              >
                ${entry.item.isOverdue ? `<span class="overdue-label">เลยกำหนด</span>` : ``}
                ${escapeHtml(entry.item.topic || "")}
                ${entry.item.dueDate ? ` | กำหนดส่ง: ${escapeHtml(formatTimestamp(entry.item.dueDate))}` : ``}
              </button>
            </li>
          `).join("")}
        </ul>
      </div>
    `;
  }

  const sidebar =
    document.getElementById("studentWorkSidebar");

  if(sidebar){
    sidebar.innerHTML = allData.length > 0
      ? `
        <div class="status-box student-toc">
          <h3>สารบัญงาน</h3>
          <div class="student-toc-list">
            <button
              type="button"
              class="${selectedMyWorkIndex === null ? "active" : ""}"
              onclick="showAllMyWork()"
            >
              หน้าหลักรวมทุกงาน
            </button>

            ${allData.map((item, index) => `
              <button
                type="button"
                class="${selectedMyWorkIndex === index ? "active" : ""}"
                onclick="showSingleMyWork(${index})"
              >
                ${item.status !== "submitted" && item.isOverdue ? "เลยกำหนด " : ""}
                ${escapeHtml(item.topic || "")}
              </button>
            `).join("")}
          </div>
        </div>
      `
      : "";
  }

  const displayData =
    selectedMyWorkIndex === null
    ? allData.map((item, index) => ({ item, index }))
    : allData
        .map((item, index) => ({ item, index }))
        .filter(entry => entry.index === selectedMyWorkIndex);

  displayData.forEach(entry => {

    const item =
      entry.item;

    const index =
      entry.index;

    const isSubmitted =
      item.status === "submitted";

    const scoreText =
      String(item.score ?? "").trim();

    const isCheckedOnly =
      scoreText === "ตรวจแล้ว";

    const canDelete =
      isSubmitted &&
      !scoreText &&
      item.sheetUrl &&
      item.rowIndex;

    const studentScoreStatus =
      isSubmitted
        ? (
            scoreText
              ? (isCheckedOnly ? "ตรวจแล้ว" : "ให้คะแนนแล้ว")
              : "ยังไม่ได้ตรวจ"
          )
        : "";

    const scoreStatusHtml =
      isSubmitted
      ? `
        <div class="work-status ${scoreText ? "submitted-status" : "missing-status"}">
          ${escapeHtml(studentScoreStatus)}
        </div>
      `
      : ``;

    const worksheetHtml =
      renderMyWorkWorksheet(item, isSubmitted, index);

    html += `

      <div class="card" id="myWorkCard_${index}">

        ${
          canDelete
          ? `
            <button
              type="button"
              class="student-delete-button"
              title="ลบงาน"
              onclick="deleteMySubmission(
                '${escapeJsString(item.sheetUrl || "")}',
                '${escapeJsString(item.rowIndex || "")}',
                '${escapeJsString(item.submitMode || "งานเดี่ยว")}'
              )"
            >
              🗑
            </button>
          `
          : ``
        }

        <h3>
          ${!isSubmitted && item.isOverdue ? `<span class="overdue-label">เลยกำหนด</span>` : ``}
          ${escapeHtml(item.topic || "")}
        </h3>

        <div class="work-status ${isSubmitted ? "submitted-status" : "missing-status"}">
          ${isSubmitted ? "✅ ส่งแล้ว" : "❌ ยังไม่ได้ส่ง"}
        </div>

        ${scoreStatusHtml}

        ${worksheetHtml}

        ${
          isSubmitted
          ? `
            <div class="meta">
              <div>ห้อง: ${escapeHtml(item.class || "")}</div>
              ${
                item.submitMode === "งานกลุ่ม"
                ? `<div>กลุ่ม: ${escapeHtml(item.groupName || "-")}</div>
                   <div>ผู้ส่งงานกลุ่ม: ${escapeHtml(item.submitterName || item.name || "-")}</div>`
                : `<div>เลขที่: ${escapeHtml(item.no || "")}</div>`
              }
              <div>เวลาส่งงาน: ${escapeHtml(formatTimestamp(item.timestamp))}</div>
              ${item.isLate ? `<div class="score-late">ส่งช้า</div>` : ``}
            </div>

            <div class="work-box">
              <h4>งานที่ส่ง</h4>
              ${renderWorkContent(item.work)}
            </div>
          `
          : `
            <div class="meta">
              <div>ห้อง: ${escapeHtml(item.class || "")}</div>
              <div>เลขที่: ${escapeHtml(item.no || "")}</div>
              ${item.dueDate ? `<div>กำหนดส่ง: ${escapeHtml(formatTimestamp(item.dueDate))}</div>` : ``}
            </div>

            <div class="work-box">
              <p class="empty-text">
                ยังไม่พบการส่งงานของคุณในหัวข้อนี้
              </p>
            </div>
          `
        }

      </div>
    `;
  });

    document.getElementById("myWorkCard_" + selectedMyWorkIndex)
  ){
    document
      .getElementById("myWorkCard_" + selectedMyWorkIndex)
      .scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
  }
}

function renderMyWorkWorksheet(item, isSubmitted, index){

  const worksheetUrl =
    String(item.worksheetUrl || "").trim();

  const worksheetVisible =
    item.worksheetVisible === false ||
    String(item.worksheetVisible || "").trim() === "false"
      ? false
      : true;

  const worksheetId =
    "myWorksheet_" + index;

  const canShowWorksheet =
    worksheetUrl && worksheetVisible;

  const startVisible =
    canShowWorksheet && !isSubmitted;

  let buttons = `
    <div class="student-work-actions">
  `;

  if(canShowWorksheet){
    buttons += `
      <button
        type="button"
        class="my-worksheet-toggle"
        onclick="toggleMyWorksheet('${escapeJsString(worksheetId)}', this)"
      >
        ${startVisible ? "ซ่อนใบงาน" : "แสดงใบงาน"}
      </button>
    `;
  }

  if(!isSubmitted){
    buttons += `
      <button
        type="button"
        onclick="openStudentSubmitModalByIndex(${index})"
      >
        ส่งงาน
      </button>
    `;
  } else if(item.canRevise){
    buttons += `
      <button
        type="button"
        onclick="openStudentSubmitModalByIndex(${index})"
      >
        ส่งงานแก้ไข
      </button>
    `;
  }

  buttons += `</div>`;

  if(!canShowWorksheet){
    return buttons;
  }

  return `
    ${buttons}
    <div
      id="${escapeAttribute(worksheetId)}"
      class="work-box student-worksheet-box"
      style="display:${startVisible ? "block" : "none"};"
    >
      <h4>ใบงาน / เอกสารประกอบ</h4>
      ${renderWorksheetContent(worksheetUrl)}
    </div>
  `;
}

function toggleMyWorksheet(id, button){

  const box =
    document.getElementById(id);

  if(!box){
    return;
  }

  const willShow =
    box.style.display === "none" || box.style.display === "";

  box.style.display = willShow ? "block" : "none";

  if(button){
    button.textContent = willShow ? "ซ่อนใบงาน" : "แสดงใบงาน";
  }
}

function getGroupCandidateMembersFromSubmitItem(){

  const candidates =
    currentSubmitWorkItem &&
    Array.isArray(currentSubmitWorkItem.groupCandidateMembers)
      ? currentSubmitWorkItem.groupCandidateMembers
      : [];

  const normalized = [];

  candidates.forEach(member => {
    if(!member || !member.id){
      return;
    }

    const exists =
      normalized.some(item =>
        String(item.id || "").trim() === String(member.id || "").trim()
      );

    if(!exists){
      normalized.push({
        id: String(member.id || "").trim(),
        name: String(member.name || "").trim(),
        no: String(member.no || "").trim(),
        className: String(member.className || member.class || currentStudentClass || "").trim(),
        photoUrl: String(member.photoUrl || "").trim(),
        studentOrder: String(member.studentOrder || "").trim()
      });
    }
  });

  const hasCurrentStudent =
    normalized.some(member =>
      String(member.id || "").trim() === String(currentStudentId || "").trim()
    );

  if(!hasCurrentStudent){
    normalized.unshift({
      id: currentStudentId,
      name: currentStudentName,
      no: currentStudentNo,
      className: currentStudentClass
    });
  }

  return normalized.sort((a, b) =>
    String(a.studentOrder || calculateStudentOrder(a.className, a.no) || a.no || a.name || a.id)
      .localeCompare(
        String(b.studentOrder || calculateStudentOrder(b.className, b.no) || b.no || b.name || b.id),
        "th",
        { numeric: true }
      )
  );
}

function getGroupMembersFromSubmitItem(){

  const fixedMembers =
    currentSubmitWorkItem &&
    Array.isArray(currentSubmitWorkItem.groupMembers) &&
    currentSubmitWorkItem.groupMembers.length > 0
      ? currentSubmitWorkItem.groupMembers
      : [];

  if(fixedMembers.length > 0){
    return fixedMembers;
  }

  return getGroupCandidateMembersFromSubmitItem()
    .filter(member =>
      String(member.id || "").trim() === String(currentStudentId || "").trim()
    );
}

function getCandidateMemberById(memberId){

  const id =
    String(memberId || "").trim();

  return getGroupCandidateMembersFromSubmitItem()
    .find(member => String(member.id || "").trim() === id) || null;
}

function getCurrentGroupMemberRows(){

  const rows =
    Array.from(document.querySelectorAll(".group-member-select-row"));

  return rows.map((row, index) => {

    const select =
      row.querySelector(".group-member-select");

    const selectedId =
      select ? String(select.value || "").trim() : "";

    const selectedStatus =
      row.querySelector(`input[name="groupMemberStatus_${index}"]:checked`);

    return {
      id: selectedId,
      status: selectedStatus ? selectedStatus.value : ""
    };
  });
}

function buildGroupMemberSelectOptions(selectedId, locked){

  const candidates =
    getGroupCandidateMembersFromSubmitItem();

  let html =
    locked ? "" : `<option value="">-- เลือกสมาชิก --</option>`;

  candidates.forEach(member => {

    const label =
      `${member.no ? "เลขที่ " + member.no + " " : ""}${member.name || member.id}`;

    html += `
      <option
        value="${escapeAttribute(member.id || "")}"
        ${String(member.id || "").trim() === String(selectedId || "").trim() ? "selected" : ""}
      >
        ${escapeHtml(label)}
      </option>
    `;
  });

  return html;
}

function buildGroupMemberRowHtml(rowData, index, locked){

  const selectedId =
    String(rowData && rowData.id ? rowData.id : "").trim();

  const selectedStatus =
    String(rowData && rowData.status ? rowData.status : "").trim();

  return `
    <div class="group-assessment-row group-member-select-row" data-row-index="${escapeAttribute(index)}">
      <label>${locked ? "ผู้ส่งงาน" : "สมาชิกกลุ่ม"}</label>

      <select
        class="group-member-select"
        onchange="refreshGroupMemberDuplicateRules()"
        ${locked ? "disabled" : ""}
      >
        ${buildGroupMemberSelectOptions(selectedId, locked)}
      </select>

      ${locked ? `<input type="hidden" class="group-member-fixed-id" value="${escapeAttribute(selectedId)}">` : ``}

      <div class="group-assessment-options">
        <label>
          <input type="radio" name="groupMemberStatus_${index}" value="ช่วยงานเต็มที่" ${selectedStatus === "ช่วยงานเต็มที่" ? "checked" : ""}>
          ช่วยงานเต็มที่
        </label>
        <label>
          <input type="radio" name="groupMemberStatus_${index}" value="ช่วยบางส่วน" ${selectedStatus === "ช่วยบางส่วน" ? "checked" : ""}>
          ช่วยบางส่วน
        </label>
        <label>
          <input type="radio" name="groupMemberStatus_${index}" value="ไม่ช่วยงาน" ${selectedStatus === "ไม่ช่วยงาน" ? "checked" : ""}>
          ไม่ช่วยงาน
        </label>
      </div>

      ${
        locked
          ? ``
          : `<button type="button" onclick="removeGroupMemberRow(${index})">ลบสมาชิกนี้</button>`
      }
    </div>
  `;
}

function renderGroupMemberRows(rows){

  const rowsBox =
    document.getElementById("groupMemberRows");

  if(!rowsBox){
    return;
  }

  const initialRows =
    Array.isArray(rows) && rows.length > 0
      ? rows
      : [{ id: currentStudentId, status: "" }];

  const hasCurrentStudent =
    initialRows.some(row =>
      String(row.id || "").trim() === String(currentStudentId || "").trim()
    );

  const normalizedRows =
    hasCurrentStudent
      ? initialRows
      : [{ id: currentStudentId, status: "" }, ...initialRows];

  rowsBox.innerHTML =
    normalizedRows.map((row, index) =>
      buildGroupMemberRowHtml(row, index, index === 0)
    ).join("");

  refreshGroupMemberDuplicateRules();
}

function addGroupMemberRow(){

  const rows =
    getCurrentGroupMemberRows();

  rows.push({
    id: "",
    status: ""
  });

  renderGroupMemberRows(rows);
}

function removeGroupMemberRow(index){

  const rows =
    getCurrentGroupMemberRows();

  const filtered =
    rows.filter((row, rowIndex) => rowIndex !== Number(index));

  renderGroupMemberRows(filtered);
}

function refreshGroupMemberDuplicateRules(){

  const selects =
    Array.from(document.querySelectorAll(".group-member-select"));

  const selectedIds =
    selects
      .map(select => String(select.value || "").trim())
      .filter(Boolean);

  selects.forEach(select => {

    const ownValue =
      String(select.value || "").trim();

    Array.from(select.options).forEach(option => {

      const optionValue =
        String(option.value || "").trim();

      if(!optionValue || optionValue === ownValue){
        option.disabled = false;
        return;
      }

      option.disabled = selectedIds.includes(optionValue);
    });
  });
}
