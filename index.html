<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Matrix Student System</title>

<style>

body{
  margin:0;
  overflow-x:hidden;
  background:black;
  color:#00ff41;
  font-family:monospace;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

.login-box{
  width:320px;
  margin:100px auto;
  background:rgba(0,0,0,0.88);
  border:1px solid #00ff41;
  padding:22px;
  box-shadow:0 0 20px #00ff41;
}

.panel{
  display:none;
  padding:20px;
  max-width:1100px;
  margin:auto;
}

input,
select,
button{
  width:100%;
  box-sizing:border-box;
  margin-top:10px;
  padding:11px;
  background:black;
  color:#00ff41;
  border:1px solid #00ff41;
  font-family:monospace;
}

button{
  cursor:pointer;
}

button:hover{
  background:#00ff41;
  color:black;
}

h2,h3,h4{
  text-shadow:0 0 8px #00ff41;
}

.toolbar{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}

.toolbar-button{
  margin-top:10px;
}

.status-box{
  margin-top:15px;
  padding:12px;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.88);
}

.card{
  border:1px solid #00ff41;
  margin:20px 0;
  padding:20px;
  background:rgba(17,17,17,0.96);
  box-shadow:0 0 15px #00ff41;
}

.meta{
  line-height:1.7;
}
.score-tools{
  margin-top:15px;
  padding:12px;
  border:1px dashed #00ff41;
  background:rgba(0,0,0,0.75);
}

.score-tools-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.hide-score-box{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.hide-score-box input{
  width:auto;
  margin-top:0;
}

.score-input{
  width:90px;
  text-align:center;
}

.changed-score{
  border:2px solid #ffd43b !important;
  box-shadow:0 0 8px #ffd43b;
}

.hidden-score{
  display:inline-block;
  padding:4px 10px;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.8);
  letter-spacing:3px;
}
.work-box{
  margin-top:16px;
  padding:14px;
  border:1px dashed #00ff41;
  background:rgba(0,0,0,0.72);
}

.text-work{
  white-space:pre-wrap;
  line-height:1.7;
  word-break:break-word;
}

.drive-preview{
  width:100%;
  max-width:620px;
  height:520px;
  border:1px solid #00ff41;
  background:#000;
  display:block;
  margin-top:10px;
}

.direct-image{
  width:100%;
  max-width:620px;
  max-height:520px;
  object-fit:contain;
  border:1px solid #00ff41;
  background:#000;
  display:block;
  margin-top:10px;
}

.file-link{
  display:inline-block;
  margin-top:10px;
  padding:8px 12px;
  border:1px solid #00ff41;
  color:#00ff41;
  text-decoration:none;
}

.file-link:hover{
  background:#00ff41;
  color:#000;
}

.score-area{
  margin-top:18px;
}

.empty-text{
  opacity:0.9;
}
.submit-time{
  display:inline-block;
  margin-top:8px;
  padding:8px 12px;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.75);
}

.normal-time{
  border:1px solid #00ff41;
}

.late-time{
  border:1px solid #ff3b3b;
  background:#8b0000;
  color:#ffffff;
  box-shadow:0 0 10px #ff3b3b;
}

.late-label{
  display:inline-block;
  margin-left:8px;
  padding:3px 8px;
  border-radius:999px;
  background:#ff3b3b;
  color:#ffffff;
  font-weight:bold;
}

.due-date{
  margin-top:6px;
  font-size:0.95em;
  opacity:0.95;
}
.panel-divider{
  border:0;
  border-top:1px solid #00ff41;
  margin:40px 0 30px;
}

.score-toolbar{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}

.score-table-wrap{
  margin-top:15px;
  overflow-x:auto;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.88);
}

.score-table{
  width:100%;
  min-width:900px;
  border-collapse:collapse;
}

.score-table th,
.score-table td{
  border:1px solid #00ff41;
  padding:10px;
  text-align:center;
  vertical-align:middle;
  white-space:nowrap;
}

.score-table th{
  background:rgba(0,255,65,0.12);
}

.score-table td.student-name{
  text-align:left;
  min-width:180px;
}

.score-value{
  font-weight:bold;
  font-size:1.05em;
}

.score-pending{
  display:inline-block;
  padding:4px 8px;
  border:1px solid #ffd43b;
  color:#ffd43b;
}

.score-missing{
  display:inline-block;
  padding:4px 8px;
  border:1px solid #ff3b3b;
  background:#8b0000;
  color:#fff;
}

.score-error{
  display:inline-block;
  padding:4px 8px;
  border:1px solid #ff9800;
  color:#ffcc80;
}  
@media(max-width:700px){
  .toolbar{
    grid-template-columns:1fr;
  }
.score-tools-row{
  grid-template-columns:1fr;
}
.score-toolbar{
  grid-template-columns:1fr;
}
  .login-box{
    width:auto;
    margin:70px 20px;
  }

  .drive-preview{
    height:420px;
  }
}
.work-status{
  display:inline-block;
  margin-top:10px;
  margin-bottom:10px;
  padding:6px 14px;
  border-radius:999px;
  font-weight:bold;
}

.submitted-status{
  background:#006b2d;
  color:#ffffff;
  border:1px solid #00ff41;
  box-shadow:0 0 8px #00ff41;
}

.missing-status{
  background:#8b0000;
  color:#ffffff;
  border:1px solid #ff3b3b;
  box-shadow:0 0 10px #ff3b3b;
}
.score-late{
  display:inline-block;
  margin-top:5px;
  padding:4px 8px;
  border:1px solid #ff3b3b;
  background:#8b0000;
  color:#ffffff;
  box-shadow:0 0 8px #ff3b3b;
  font-weight:bold;
}
</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div class="login-box" id="loginBox">

  <h2>LOGIN</h2>

  <input id="id" placeholder="Student ID">

  <input
    id="pass"
    type="password"
    placeholder="Password"
  >

  <button onclick="login()">
    เข้าสู่ระบบ
  </button>

  <p id="msg"></p>

</div>


<div id="teacherPanel" class="panel">

  <h2>Teacher Dashboard</h2>

  <div class="toolbar">

    <select id="topic">
      <option value="">กำลังโหลดหัวข้องาน...</option>
    </select>

    <select id="classFilter">
      <option value="">ทุกห้อง</option>
    </select>

    <input
      id="noFilter"
      type="number"
      placeholder="กรองเลขที่"
    >

  </div>

  <button class="toolbar-button" onclick="loadWork()">
    โหลดงาน
  </button>

  <div id="workStatus"></div>
  <div id="work"></div>
<hr class="panel-divider">

<h2>ตารางคะแนนรายงาน</h2>

<div class="score-toolbar">

  <select id="scoreLevel">
    <option value="">กำลังโหลดระดับชั้น...</option>
  </select>

  <select id="scoreClass">
    <option value="">ทุกห้อง</option>
  </select>

  <button onclick="loadScoreTable()">
    โหลดตารางคะแนน
  </button>

</div>

<div id="scoreTableStatus"></div>

<div class="score-tools">

  <label class="hide-score-box">
    <input
      type="checkbox"
      id="hideScoresToggle"
      onchange="toggleHideScores()"
    >
    ซ่อนคะแนนในตาราง
  </label>

  <div class="score-tools-row">

    <select id="bulkAssignment">
      <option value="">เลือกงานที่ต้องการให้คะแนน</option>
    </select>

    <input
      id="bulkScore"
      type="number"
      placeholder="คะแนน"
    >

    <button onclick="applyBulkScoreToColumn()">
      ใส่คะแนนให้ผู้ที่ส่งงานแล้ว
    </button>

  </div>

  <button class="toolbar-button" onclick="saveAllScoreChanges()">
    บันทึกคะแนนทั้งหมดลงชีตงาน
  </button>

  <div id="bulkScoreStatus"></div>

</div>

<div id="scoreTableWrap" class="score-table-wrap"></div>
<button class="toolbar-button" onclick="exportScoreSummary()">
  บันทึกตารางคะแนนลง Sheet
</button>

<div id="exportSummaryStatus"></div>
</div>


<div id="studentPanel" class="panel">

  <h2>Student Dashboard</h2>

  <div id="studentData"></div>
  <div id="myWorkStatus"></div>
  <div id="myWork"></div>

</div>


<script>

// ใช้ API URL เดิมของคุณ
const API_URL =
  "https://script.google.com/macros/s/AKfycby8O-pR0tldFrn3EW4IchW8H2oib7v6JPU_gmBDDx_ZZYmxb_O93_7J9j78QsmJZU32-g/exec";

let currentWorkData = [];
let currentSheetUrl = "";

let currentStudentId = "";
let currentStudentName = "";
let scoreOptionsData = [];
let lastScoreTableData = null;
let hideScoreValues = false;
let changedScoreMap = {};

// ======================================
// LOGIN
// ======================================
function login(){

  const id = document
    .getElementById("id")
    .value
    .trim();

  const pass = document
    .getElementById("pass")
    .value
    .trim();

  const msg = document.getElementById("msg");

  if(!id || !pass){
    msg.innerHTML = "❌ กรุณากรอก ID และ Password";
    return;
  }

  msg.innerHTML = "กำลังเข้าสู่ระบบ...";

  fetch(
    API_URL
    + "?action=login"
    + "&id=" + encodeURIComponent(id)
    + "&pass=" + encodeURIComponent(pass)
  )

  .then(res => res.json())

  .then(data => {

    if(data.status === "success"){

      document
        .getElementById("loginBox")
        .style.display = "none";

      if(String(data.role).trim() === "teacher"){

        document
          .getElementById("teacherPanel")
          .style.display = "block";

        loadTopics();
        loadScoreOptions();
      }

      else{

  currentStudentId = data.id;
  currentStudentName = data.name;

  document
    .getElementById("studentPanel")
    .style.display = "block";

  document
    .getElementById("studentData")
    .innerHTML =
    `<div class="status-box">
      ยินดีต้อนรับ ${escapeHtml(data.name)}
    </div>`;

  loadMyWork();
}
    }

    else{
      msg.innerHTML =
        "❌ " + escapeHtml(data.message || "Login Failed");
    }
  })

  .catch(error => {
    console.error(error);
    msg.innerHTML = "❌ เชื่อมต่อ API ไม่สำเร็จ";
  });
}


// ======================================
// โหลดหัวข้องาน
// ======================================
function loadTopics(){

  const topicSelect = document.getElementById("topic");

  topicSelect.innerHTML =
    `<option value="">กำลังโหลดหัวข้องาน...</option>`;

  fetch(API_URL + "?action=topics")

  .then(res => res.json())

  .then(response => {

    let topics = [];

    // รองรับ API เวอร์ชันใหม่
    if(
      response &&
      response.status === "success" &&
      Array.isArray(response.data)
    ){
      topics = response.data;
    }

    // รองรับ API เก่าที่ส่ง array ตรง ๆ
    else if(Array.isArray(response)){
      topics = response;
    }

    else{
      topicSelect.innerHTML =
        `<option value="">โหลดหัวข้องานไม่สำเร็จ</option>`;

      console.log("Topics API Response:", response);
      return;
    }

    if(topics.length === 0){
      topicSelect.innerHTML =
        `<option value="">ยังไม่มีหัวข้องาน</option>`;
      return;
    }

    let html =
      `<option value="">-- เลือกหัวข้องาน --</option>`;

    topics.forEach(t => {

      html += `
        <option value="${escapeAttribute(t.url)}">
          ${escapeHtml(t.level)} - ${escapeHtml(t.topic)}
        </option>
      `;
    });

    topicSelect.innerHTML = html;
  })

  .catch(error => {
    console.error(error);
    topicSelect.innerHTML =
      `<option value="">โหลดหัวข้องานไม่สำเร็จ</option>`;
  });
}


// ======================================
// โหลดงานนักเรียน
// ======================================
function loadWork(){

  const url = document
    .getElementById("topic")
    .value;

  const workBox = document.getElementById("work");
  const workStatus = document.getElementById("workStatus");

  if(!url){
    workStatus.innerHTML =
      `<div class="status-box">❌ กรุณาเลือกหัวข้องานก่อน</div>`;
    workBox.innerHTML = "";
    return;
  }

  currentSheetUrl = url;

  workStatus.innerHTML =
    `<div class="status-box">กำลังโหลดงาน...</div>`;

  workBox.innerHTML = "";

  fetch(
    API_URL
    + "?action=studentWork"
    + "&url="
    + encodeURIComponent(url)
  )

  .then(res => res.json())

  .then(response => {

    let data = [];

    // API ใหม่
    if(
      response &&
      response.status === "success" &&
      Array.isArray(response.data)
    ){
      data = response.data;
    }

    // เผื่อ API เก่าที่ยังส่ง array ตรง ๆ
    else if(Array.isArray(response)){
      data = response;
    }

    else{
      workStatus.innerHTML =
        `<div class="status-box">
          ❌ โหลดงานไม่สำเร็จ:
          ${escapeHtml(response.message || "รูปแบบข้อมูลจาก API ไม่ถูกต้อง")}
        </div>`;

      console.log("StudentWork API Response:", response);
      return;
    }

    currentWorkData = data;

    if(currentWorkData.length === 0){

      workStatus.innerHTML =
        `<div class="status-box">ยังไม่มีข้อมูลงานนักเรียนในชีทนี้</div>`;

      return;
    }

    populateClassFilter(currentWorkData);

    workStatus.innerHTML =
      `<div class="status-box">
        พบงานทั้งหมด ${currentWorkData.length} รายการ
      </div>`;

    renderWorkCards();
  })

  .catch(error => {

    console.error(error);

    workStatus.innerHTML =
      `<div class="status-box">
        ❌ เกิดข้อผิดพลาดในการเชื่อมต่อ API
      </div>`;
  });
}


// ======================================
// สร้างตัวเลือกห้องเรียน
// ======================================
function populateClassFilter(data){

  const classSelect = document.getElementById("classFilter");

  const classes = [
    ...new Set(
      data
        .map(item => String(item.class || "").trim())
        .filter(Boolean)
    )
  ];

  let html = `<option value="">ทุกห้อง</option>`;

  classes.forEach(className => {
    html += `
      <option value="${escapeAttribute(className)}">
        ${escapeHtml(className)}
      </option>
    `;
  });

  classSelect.innerHTML = html;

  classSelect.onchange = renderWorkCards;
  document.getElementById("noFilter").oninput = renderWorkCards;
}


// ======================================
// แสดงการ์ดงาน พร้อมกรองห้อง/เลขที่
// ======================================
function renderWorkCards(){

  const workBox = document.getElementById("work");

  const selectedClass =
    document
    .getElementById("classFilter")
    .value;

  const selectedNo =
    document
    .getElementById("noFilter")
    .value
    .trim();

  let html = "";
  let visibleCount = 0;

  currentWorkData.forEach(s => {

    const studentClass = String(s.class || "").trim();
    const studentNo = String(s.no || "").trim();

    if(
      selectedClass &&
      studentClass !== selectedClass
    ){
      return;
    }

    if(
      selectedNo &&
      studentNo !== selectedNo
    ){
      return;
    }

    visibleCount++;

    const workValue =
      s.work !== undefined
      ? s.work
      : (s.image !== undefined ? s.image : "");

    html += `

      <div class="card">

        <h3>
          ${escapeHtml(studentClass)}
          เลขที่ ${escapeHtml(studentNo)}
        </h3>

        <div class="meta">
  <div>ชื่อ: ${escapeHtml(s.name || "")}</div>
  <div>รหัสนักเรียน: ${escapeHtml(s.id || "")}</div>

  <div class="submit-time ${s.isLate ? "late-time" : "normal-time"}">
    เวลาส่งงาน: ${escapeHtml(formatTimestamp(s.timestamp))}
    ${s.isLate ? `<span class="late-label">ส่งช้า</span>` : ``}
  </div>

  ${
    s.dueDate
    ? `
      <div class="due-date">
        กำหนดส่งของห้องนี้:
        ${escapeHtml(formatTimestamp(s.dueDate))}
      </div>
    `
    : ``
  }
</div>

        <div class="work-box">
          <h4>งานที่ส่ง</h4>
          ${renderWorkContent(workValue)}
        </div>

        <div class="score-area">

          <input
            type="number"
            id="score_${escapeAttribute(s.rowIndex || s.id)}"
            value="${escapeAttribute(s.score || "")}"
            placeholder="คะแนน"
          >

          <button
            onclick="saveScore(
              '${escapeJsString(currentSheetUrl)}',
              '${escapeJsString(s.id || "")}',
              '${escapeJsString(s.rowIndex || "")}'
            )"
          >
            บันทึกคะแนน
          </button>

        </div>

      </div>
    `;
  });

  if(visibleCount === 0){
    html =
      `<div class="status-box">ไม่พบข้อมูลตามตัวกรอง</div>`;
  }

  workBox.innerHTML = html;
}


// ======================================
// แสดงงานในช่อง Work
// ถ้าเป็น Drive URL = พรีวิวไฟล์
// ถ้าเป็น image URL โดยตรง = แสดงรูป
// ถ้าเป็น URL ทั่วไป = แสดงลิงก์
// ถ้าไม่ใช่ URL = แสดงข้อความ
// ======================================
function renderWorkContent(work){

  const value = String(work || "").trim();

  if(!value){
    return `<p class="empty-text">ยังไม่มีข้อมูลงานที่ส่ง</p>`;
  }

  const driveFileId = extractDriveFileId(value);

  if(driveFileId){

    const previewUrl =
      "https://drive.google.com/file/d/"
      + driveFileId
      + "/preview";

    return `
      <iframe
        class="drive-preview"
        src="${escapeAttribute(previewUrl)}"
        allow="autoplay"
      ></iframe>

      <a
        class="file-link"
        href="${escapeAttribute(value)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        เปิดไฟล์ในแท็บใหม่
      </a>
    `;
  }

  if(isDirectImageUrl(value)){

    return `
      <img
        class="direct-image"
        src="${escapeAttribute(value)}"
        alt="Student work"
        onerror="this.outerHTML='<p>❌ ไม่สามารถแสดงรูปได้</p>';"
      >
    `;
  }

  if(isUrl(value)){

    return `
      <a
        class="file-link"
        href="${escapeAttribute(value)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        เปิดลิงก์งาน
      </a>
    `;
  }

  return `
    <div class="text-work">
      ${escapeHtml(value)}
    </div>
  `;
}


// ======================================
// บันทึกคะแนน
// ======================================
function saveScore(url, studentId, rowIndex){

  const inputId =
    "score_" + (rowIndex || studentId);

  const scoreInput =
    document.getElementById(inputId);

  if(!scoreInput){
    alert("ไม่พบช่องกรอกคะแนน");
    return;
  }

  const score = scoreInput.value;

  fetch(
    API_URL
    + "?action=updateScore"
    + "&url=" + encodeURIComponent(url)
    + "&studentId=" + encodeURIComponent(studentId)
    + "&rowIndex=" + encodeURIComponent(rowIndex)
    + "&score=" + encodeURIComponent(score)
  )

  .then(res => res.json())

  .then(data => {

    if(data.status === "success"){
      alert("✅ บันทึกคะแนนแล้ว");
    }

    else{
      alert("❌ " + (data.message || "บันทึกคะแนนไม่สำเร็จ"));
    }
  })

  .catch(error => {
    console.error(error);
    alert("❌ เชื่อมต่อ API ไม่สำเร็จ");
  });
}


// ======================================
// แยก FILE ID จากลิงก์ Google Drive
// รองรับ:
// - open?id=...
// - /file/d/.../view
// - uc?id=...
// ======================================
function extractDriveFileId(url){

  const value = String(url || "").trim();

  const matchById =
    value.match(/[?&]id=([a-zA-Z0-9_-]+)/);

  if(matchById && matchById[1]){
    return matchById[1];
  }

  const matchByD =
    value.match(/\/d\/([a-zA-Z0-9_-]+)/);

  if(matchByD && matchByD[1]){
    return matchByD[1];
  }

  return "";
}


// ======================================
// ตรวจ URL
// ======================================
function isUrl(value){
  return /^https?:\/\/\S+$/i.test(String(value || "").trim());
}


// ======================================
// ตรวจ direct image url
// ======================================
function isDirectImageUrl(value){
  return /^https?:\/\/\S+\.(png|jpg|jpeg|gif|webp|bmp|svg)(\?\S*)?$/i
    .test(String(value || "").trim());
}


// ======================================
// ป้องกัน HTML แตก
// ======================================
function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttribute(value){
  return escapeHtml(value);
}

function escapeJsString(value){

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"')
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");
}
// ======================================
// จัดรูปแบบวันและเวลาส่งงาน
// ======================================
function formatTimestamp(value){

  if(!value){
    return "-";
  }

  const date = new Date(value);

  if(isNaN(date.getTime())){
    return String(value);
  }

  return new Intl.DateTimeFormat("th-TH", {
    timeZone: "Asia/Bangkok",
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  }).format(date);
}
// ======================================
// โหลดงานและคะแนนของนักเรียนที่ล็อกอิน

function loadMyWork(){

  const statusBox =
    document.getElementById("myWorkStatus");

  const workBox =
    document.getElementById("myWork");

  statusBox.innerHTML =
    `<div class="status-box">กำลังโหลดข้อมูลงานของคุณ...</div>`;

  workBox.innerHTML = "";

  fetch(
    API_URL
    + "?action=myWork"
    + "&studentId="
    + encodeURIComponent(currentStudentId)
  )

  .then(res => res.json())

  .then(response => {

    if(
      response.status !== "success" ||
      !Array.isArray(response.data)
    ){

      statusBox.innerHTML =
        `<div class="status-box">
          ❌ โหลดข้อมูลไม่สำเร็จ:
          ${escapeHtml(response.message || "รูปแบบข้อมูลไม่ถูกต้อง")}
        </div>`;

      return;
    }

    const data = response.data;

    if(data.length === 0){

      statusBox.innerHTML =
        `<div class="status-box">
          ยังไม่พบข้อมูลงานที่ส่งของคุณ
        </div>`;

      return;
    }

    statusBox.innerHTML =
      `<div class="status-box">
        พบรายการงานของคุณ ${data.length} งาน
      </div>`;

    renderMyWorkCards(data);
  })

  .catch(error => {

    console.error(error);

    statusBox.innerHTML =
      `<div class="status-box">
        ❌ เชื่อมต่อ API ไม่สำเร็จ
      </div>`;
  });
}
// ======================================
// แสดงรายการงานของนักเรียน
// ทั้ง "ส่งแล้ว" และ "ยังไม่ได้ส่ง"
// ======================================
function renderMyWorkCards(data){

  const workBox =
    document.getElementById("myWork");

  let html = "";

  data.forEach(item => {

    const isSubmitted =
      item.status === "submitted";

    html += `

      <div class="card">

        <h3>
          ${escapeHtml(item.level || "")}
          - ${escapeHtml(item.topic || "")}
        </h3>

        <div class="work-status ${isSubmitted ? "submitted-status" : "missing-status"}">
          ${isSubmitted ? "✅ ส่งแล้ว" : "❌ ยังไม่ได้ส่ง"}
        </div>

        ${
          isSubmitted
          ? `
            <div class="meta">
              <div>ห้อง: ${escapeHtml(item.class || "")}</div>
              <div>เลขที่: ${escapeHtml(item.no || "")}</div>
              <div>เวลาส่งงาน: ${escapeHtml(formatTimestamp(item.timestamp))}</div>
            </div>

            <div class="work-box">
              <h4>งานที่ส่ง</h4>
              ${renderWorkContent(item.work)}
            </div>
          `
          : `
            <div class="meta">
              <div>ห้อง: ${escapeHtml(item.class || "")}</div>
              <div>เลขที่: ${escapeHtml(item.no || "")}</div>
            </div>

            <div class="work-box">
              <p class="empty-text">
                ยังไม่พบการส่งงานของคุณในหัวข้อนี้
              </p>
            </div>
          `
        }

      </div>
    `;
  });

  workBox.innerHTML = html;
}
// ======================================
// โหลดตัวเลือกระดับชั้น / ห้อง
// สำหรับตารางคะแนนรายงาน
// ======================================
function loadScoreOptions(){

  const levelSelect =
    document.getElementById("scoreLevel");

  const classSelect =
    document.getElementById("scoreClass");

  levelSelect.innerHTML =
    `<option value="">กำลังโหลดระดับชั้น...</option>`;

  classSelect.innerHTML =
    `<option value="">ทุกห้อง</option>`;

  fetch(API_URL + "?action=scoreOptions")

  .then(res => res.json())

  .then(response => {

    if(
      response.status !== "success" ||
      !Array.isArray(response.data)
    ){
      levelSelect.innerHTML =
        `<option value="">โหลดระดับชั้นไม่สำเร็จ</option>`;
      return;
    }

    scoreOptionsData = response.data;

    if(scoreOptionsData.length === 0){
      levelSelect.innerHTML =
        `<option value="">ยังไม่มีข้อมูลระดับชั้น</option>`;
      return;
    }

    let html =
      `<option value="">-- เลือกระดับชั้น --</option>`;

    scoreOptionsData.forEach(item => {
      html += `
        <option value="${escapeAttribute(item.level)}">
          ${escapeHtml(item.level)}
        </option>
      `;
    });

    levelSelect.innerHTML = html;

    levelSelect.onchange =
      updateScoreClassOptions;
  })

  .catch(error => {
    console.error(error);
    levelSelect.innerHTML =
      `<option value="">โหลดระดับชั้นไม่สำเร็จ</option>`;
  });
}


// ======================================
// เปลี่ยนรายการห้องตามระดับชั้นที่เลือก
// ======================================
function updateScoreClassOptions(){

  const selectedLevel =
    document.getElementById("scoreLevel").value;

  const classSelect =
    document.getElementById("scoreClass");

  let html =
    `<option value="">ทุกห้อง</option>`;

  const selectedData =
    scoreOptionsData.find(item =>
      String(item.level) === String(selectedLevel)
    );

  if(
    selectedData &&
    Array.isArray(selectedData.classes)
  ){
    selectedData.classes.forEach(className => {
      html += `
        <option value="${escapeAttribute(className)}">
          ${escapeHtml(className)}
        </option>
      `;
    });
  }

  classSelect.innerHTML = html;
}

  fetch(
    API_URL
    + "?action=scoreTable"
    + "&level=" + encodeURIComponent(level)
    + "&className=" + encodeURIComponent(className)
  )

  .then(res => res.json())

  .then(response => {

    if(
      response.status !== "success" ||
      !response.data
    ){
      statusBox.innerHTML =
        `<div class="status-box">

      return;
    }

   lastScoreTableData = response.data;
changedScoreMap = {};
renderScoreTable(lastScoreTableData);
populateBulkAssignmentOptions(lastScoreTableData);

    const studentCount =
      Array.isArray(response.data.students)

// ======================================
// แสดงตารางคะแนนรายงาน
// ======================================
function renderScoreTable(data){

  const tableWrap =
    document.getElementById("scoreTableWrap");

  const assignments =
    Array.isArray(data.assignments)
    ? data.assignments
    : [];

  const students =
    Array.isArray(data.students)
    ? data.students
    : [];

  if(assignments.length === 0){
    tableWrap.innerHTML =
      `<div class="status-box">
        ยังไม่มีหัวข้องานในระดับชั้นนี้
      </div>`;
    return;
  }

  if(students.length === 0){
    tableWrap.innerHTML =
      `<div class="status-box">
        ยังไม่มีรายชื่อนักเรียนตามเงื่อนไขที่เลือก
      </div>`;
    return;
  }

  let html = `

    <table class="score-table">

      <thead>
        <tr>
          <th>เลขที่</th>
          <th>ห้อง</th>
          <th>รหัส</th>
          <th>ชื่อ</th>
  `;

  assignments.forEach(item => {
    html += `
      <th>${escapeHtml(item.topic || "")}</th>
    `;
  });

  html += `
        </tr>
      </thead>
      <tbody>
  `;

  students.forEach(student => {

    html += `
      <tr>
        <td>${escapeHtml(student.no || "")}</td>
        <td>${escapeHtml(student.class || "")}</td>
        <td>${escapeHtml(student.id || "")}</td>
        <td class="student-name">${escapeHtml(student.name || "")}</td>
    `;

    const scores =
      Array.isArray(student.scores)
      ? student.scores
      : [];

    assignments.forEach((assignment, index) => {

      const cell =
        scores[index] || {
          status: "missing",
          score: ""
        };

      html += `
        <td>
          ${renderEditableScoreCell(cell, index)}
        </td>
      `;
    });

    html += `
      </tr>
    `;
  });

  html += `
      </tbody>
    </table>
  `;

  tableWrap.innerHTML = html;
}
// ======================================
// แสดงช่องคะแนนแบบแก้ไขได้
// ======================================
function renderEditableScoreCell(cell, assignmentIndex){

  const status =
    cell.status || "missing";

  const score =
    cell.score ?? "";

  const rowIndex =
    cell.rowIndex || "";

  const studentId =
    cell.studentId || "";

  const sheetUrl =
    cell.sheetUrl || "";

  const key =
    sheetUrl + "|" + rowIndex + "|" + studentId + "|" + assignmentIndex;

  // ถ้าซ่อนคะแนน ให้บังเฉพาะคะแนนที่มี
  if(
    hideScoreValues &&
    status === "scored"
  ){
    return `
      <span class="hidden-score">••••</span>
    `;
  }

  // ส่งแล้ว มีแถวในชีตแล้ว ให้แก้คะแนนได้
  if(
    status === "scored" ||
    status === "pending"
  ){
    return `
  <div>
    <input
      class="score-input"
      type="number"
      value="${escapeAttribute(score)}"
      placeholder="${status === "pending" ? (cell.isLate ? "ส่งช้า/รอตรวจ" : "รอตรวจ") : ""}"
      data-key="${escapeAttribute(key)}"
      data-url="${escapeAttribute(sheetUrl)}"
      data-row-index="${escapeAttribute(rowIndex)}"
      data-student-id="${escapeAttribute(studentId)}"
      data-assignment-index="${escapeAttribute(assignmentIndex)}"
      onchange="markScoreChanged(this)"
    >

    ${
      cell.isLate
      ? `<div class="score-late">ส่งช้า</div>`
      : ``
    }
  </div>
`;
  }

  if(status === "error"){
    return `
      <span class="score-error">
        เปิดชีตไม่ได้
      </span>
    `;
  }

  return `
    <span class="score-missing">
      ยังไม่ส่ง
    </span>
  `;
}

}
  // ======================================
// จำคะแนนที่มีการแก้ไข
// ======================================
function markScoreChanged(input){

  const key =
    input.getAttribute("data-key");

  changedScoreMap[key] = {
    url: input.getAttribute("data-url"),
    rowIndex: input.getAttribute("data-row-index"),
    studentId: input.getAttribute("data-student-id"),
    score: input.value
  };

  input.classList.add("changed-score");
}
// ======================================
// เติมตัวเลือกงานสำหรับให้คะแนนหลายคนพร้อมกัน
// ======================================
function populateBulkAssignmentOptions(data){

  const select =
    document.getElementById("bulkAssignment");

  const assignments =
    Array.isArray(data.assignments)
    ? data.assignments
    : [];

  let html =
    `<option value="">เลือกงานที่ต้องการให้คะแนน</option>`;

  assignments.forEach((item, index) => {
    html += `
      <option value="${escapeAttribute(index)}">
        ${escapeHtml(item.topic || "")}
      </option>
    `;
  });

  select.innerHTML = html;
}
// ======================================
// ใส่คะแนนเดียวกันให้ผู้ที่ส่งงานแล้วในงานที่เลือก
// ======================================
function applyBulkScoreToColumn(){

  const assignmentIndex =
    document.getElementById("bulkAssignment").value;

  const score =
    document.getElementById("bulkScore").value;

  const statusBox =
    document.getElementById("bulkScoreStatus");

  if(assignmentIndex === ""){
    statusBox.innerHTML =
      `<div class="status-box">❌ กรุณาเลือกงานก่อน</div>`;
    return;
  }

  if(score === ""){
    statusBox.innerHTML =
      `<div class="status-box">❌ กรุณากรอกคะแนนก่อน</div>`;
    return;
  }

  const inputs =
    document.querySelectorAll(
      `.score-input[data-assignment-index="${assignmentIndex}"]`
    );

  if(inputs.length === 0){
    statusBox.innerHTML =
      `<div class="status-box">
        ไม่พบผู้ที่ส่งงานแล้วในงานนี้
      </div>`;
    return;
  }

  inputs.forEach(input => {
    input.value = score;
    markScoreChanged(input);
  });

  statusBox.innerHTML =
    `<div class="status-box">
      ใส่คะแนน ${escapeHtml(score)}
      ให้ ${inputs.length} คนแล้ว
      กรุณากด “บันทึกคะแนนทั้งหมดลงชีตงาน”
    </div>`;
}
// ======================================
// บันทึกคะแนนทั้งหมดที่แก้ลงชีตงานจริง
// ======================================
function saveAllScoreChanges(){

  const statusBox =
    document.getElementById("bulkScoreStatus");

  const updates =
    Object.values(changedScoreMap);

  if(updates.length === 0){
    statusBox.innerHTML =
      `<div class="status-box">
        ยังไม่มีคะแนนที่แก้ไข
      </div>`;
    return;
  }

  statusBox.innerHTML =
    `<div class="status-box">
      กำลังบันทึกคะแนน ${updates.length} รายการ...
    </div>`;

  fetch(
    API_URL + "?action=batchUpdateScores",
    {
      method: "POST",
      body: JSON.stringify({
        updates: updates
      })
    }
  )

  .then(res => res.json())

  .then(response => {

    if(response.status !== "success"){

      statusBox.innerHTML =
        `<div class="status-box">
          ❌ บันทึกไม่สำเร็จ:
          ${escapeHtml(response.message || "เกิดข้อผิดพลาด")}
        </div>`;

      return;
    }

    statusBox.innerHTML =
      `<div class="status-box">
        ✅ บันทึกสำเร็จ
        ${escapeHtml(response.data.successCount)} รายการ
        ${
          response.data.failCount
          ? ` | ไม่สำเร็จ ${escapeHtml(response.data.failCount)} รายการ`
          : ``
        }
      </div>`;

    changedScoreMap = {};

    loadScoreTable();
  })

  .catch(error => {

    console.error(error);

    statusBox.innerHTML =
      `<div class="status-box">
        ❌ เชื่อมต่อ API ไม่สำเร็จ
      </div>`;
  });
}
// ======================================
// แสดงค่าในช่องคะแนน
// ======================================
function renderScoreCell(cell){

  if(cell.status === "scored"){
    return `
      <span class="score-value">
        ${escapeHtml(cell.score)}
      </span>
    `;
  }

  if(cell.status === "pending"){
    return `
      <span class="score-pending">
        รอตรวจ
      </span>
    `;
  }

  if(cell.status === "error"){
    return `
      <span class="score-error">
        เปิดชีตไม่ได้
      </span>
    `;
  }

  return `
    <span class="score-missing">
      ยังไม่ส่ง
    </span>
  `;
}
// ======================================
// Matrix Background
// ======================================
const canvas =
  document.getElementById("matrix");

const ctx =
  canvas.getContext("2d");

canvas.width =
  window.innerWidth;

canvas.height =
  window.innerHeight;

const letters =
  "アイウエオ0123456789";

const fontSize = 16;

let columns =
  Math.floor(canvas.width / fontSize);

let drops = [];

function initMatrix(){

  columns =
    Math.floor(canvas.width / fontSize);

  drops = [];

  for(let i = 0; i < columns; i++){
    drops[i] = 1;
  }
}

initMatrix();

function draw(){

  ctx.fillStyle =
    "rgba(0,0,0,0.05)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle =
    "#00ff41";

  ctx.font =
    fontSize + "px monospace";

  for(let i = 0; i < drops.length; i++){

    const text =
      letters[
        Math.floor(
          Math.random() * letters.length
        )
      ];

    ctx.fillText(
      text,
      i * fontSize,
      drops[i] * fontSize
    );

    if(
      drops[i] * fontSize > canvas.height &&
      Math.random() > 0.975
    ){
      drops[i] = 0;
    }

    drops[i]++;
  }
}

setInterval(draw, 33);

window.addEventListener("resize", () => {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

  initMatrix();
});
