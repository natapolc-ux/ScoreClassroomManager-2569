<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Matrix Student System</title>

<style>

body{
  margin:0;
  overflow-x:hidden;
  background:black;
  color:#00ff41;
  font-family:monospace;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

.login-box{
  width:320px;
  margin:100px auto;
  background:rgba(0,0,0,0.88);
  border:1px solid #00ff41;
  padding:22px;
  box-shadow:0 0 20px #00ff41;
}

.panel{
  display:none;
  padding:20px;
  max-width:1100px;
  margin:auto;
}

input,
select,
button{
  width:100%;
  box-sizing:border-box;
  margin-top:10px;
  padding:11px;
  background:black;
  color:#00ff41;
  border:1px solid #00ff41;
  font-family:monospace;
}

button{
  cursor:pointer;
}

button:hover{
  background:#00ff41;
  color:black;
}

h2,h3,h4{
  text-shadow:0 0 8px #00ff41;
}

.toolbar{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}

.toolbar-button{
  margin-top:10px;
}

.status-box{
  margin-top:15px;
  padding:12px;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.88);
}

.card{
  border:1px solid #00ff41;
  margin:20px 0;
  padding:20px;
  background:rgba(17,17,17,0.96);
  box-shadow:0 0 15px #00ff41;
}

.meta{
  line-height:1.7;
}
.score-tools{
  margin-top:15px;
  padding:12px;
  border:1px dashed #00ff41;
  background:rgba(0,0,0,0.75);
}

.score-tools-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.hide-score-box{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.hide-score-box input{
  width:auto;
  margin-top:0;
}

.score-input{
  width:90px;
  text-align:center;
}

.changed-score{
  border:2px solid #ffd43b !important;
  box-shadow:0 0 8px #ffd43b;
}

.hidden-score{
  display:inline-block;
  padding:4px 10px;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.8);
  letter-spacing:3px;
}
.work-box{
  margin-top:16px;
  padding:14px;
  border:1px dashed #00ff41;
  background:rgba(0,0,0,0.72);
}

.text-work{
  white-space:pre-wrap;
  line-height:1.7;
  word-break:break-word;
}

.drive-preview{
  width:100%;
  max-width:620px;
  height:520px;
  border:1px solid #00ff41;
  background:#000;
  display:block;
  margin-top:10px;
}

.direct-image{
  width:100%;
  max-width:620px;
  max-height:520px;
  object-fit:contain;
  border:1px solid #00ff41;
  background:#000;
  display:block;
  margin-top:10px;
}

.file-link{
  display:inline-block;
  margin-top:10px;
  padding:8px 12px;
  border:1px solid #00ff41;
  color:#00ff41;
  text-decoration:none;
}

.file-link:hover{
  background:#00ff41;
  color:#000;
}

.score-area{
  margin-top:18px;
}

.empty-text{
  opacity:0.9;
}
.submit-time{
  display:inline-block;
  margin-top:8px;
  padding:8px 12px;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.75);
}

.normal-time{
  border:1px solid #00ff41;
}

.late-time{
  border:1px solid #ff3b3b;
  background:#8b0000;
  color:#ffffff;
  box-shadow:0 0 10px #ff3b3b;
}

.late-label{
  display:inline-block;
  margin-left:8px;
  padding:3px 8px;
  border-radius:999px;
  background:#ff3b3b;
  color:#ffffff;
  font-weight:bold;
}

.due-date{
  margin-top:6px;
  font-size:0.95em;
  opacity:0.95;
}
.panel-divider{
  border:0;
  border-top:1px solid #00ff41;
  margin:40px 0 30px;
}

.score-toolbar{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}

.score-table-wrap{
  margin-top:15px;
  overflow-x:auto;
  border:1px solid #00ff41;
  background:rgba(0,0,0,0.88);
}

.score-table{
  width:100%;
  min-width:900px;
  border-collapse:collapse;
}

.score-table th,
.score-table td{
  border:1px solid #00ff41;
  padding:10px;
  text-align:center;
  vertical-align:middle;
  white-space:nowrap;
}

.score-table th{
  background:rgba(0,255,65,0.12);
}

.score-table td.student-name{
  text-align:left;
  min-width:180px;
}

.score-value{
  font-weight:bold;
  font-size:1.05em;
}

.score-pending{
  display:inline-block;
  padding:4px 8px;
  border:1px solid #ffd43b;
  color:#ffd43b;
}

.score-missing{
  display:inline-block;
  padding:4px 8px;
  border:1px solid #ff3b3b;
  background:#8b0000;
  color:#fff;
}

.score-error{
  display:inline-block;
  padding:4px 8px;
  border:1px solid #ff9800;
  color:#ffcc80;
}  
@media(max-width:700px){
  .toolbar{
    grid-template-columns:1fr;
  }
.score-tools-row{
  grid-template-columns:1fr;
}
.score-toolbar{
  grid-template-columns:1fr;
}
  .login-box{
    width:auto;
    margin:70px 20px;
  }

  .drive-preview{
    height:420px;
  }
}
.work-status{
  display:inline-block;
  margin-top:10px;
  margin-bottom:10px;
  padding:6px 14px;
  border-radius:999px;
  font-weight:bold;
}

.submitted-status{
  background:#006b2d;
  color:#ffffff;
  border:1px solid #00ff41;
  box-shadow:0 0 8px #00ff41;
}

.missing-status{
  background:#8b0000;
  color:#ffffff;
  border:1px solid #ff3b3b;
  box-shadow:0 0 10px #ff3b3b;
}
.score-late{
  display:inline-block;
  margin-top:5px;
  padding:4px 8px;
  border:1px solid #ff3b3b;
  background:#8b0000;
  color:#ffffff;
  box-shadow:0 0 8px #ff3b3b;
  font-weight:bold;
}
.select-score-box{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.select-score-box input[type="checkbox"]{
  width:auto;
  margin-top:0;
}

.selected-score-cell{
  outline:2px solid #ffd43b;
  box-shadow:0 0 8px #ffd43b;
}
</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div class="login-box" id="loginBox">

  <h2>LOGIN</h2>

  <input id="id" placeholder="Student ID">

  <input
    id="pass"
    type="password"
    placeholder="Password"
  >

  <button onclick="login()">
    เข้าสู่ระบบ
  </button>

  <p id="msg"></p>

</div>


<div id="teacherPanel" class="panel">

  <h2>Teacher Dashboard</h2>

  <div class="toolbar">

    <select id="topic">
      <option value="">กำลังโหลดหัวข้องาน...</option>
    </select>

    <select id="classFilter">
      <option value="">ทุกห้อง</option>
    </select>

    <input
      id="noFilter"
      type="number"
      placeholder="กรองเลขที่"
    >

  </div>

  <button class="toolbar-button" onclick="loadWork()">
    โหลดงาน
  </button>
  <button type="button" onclick="refreshWorkList()">
  🔄 รีเฟรชผลงาน
</button>

<span id="refreshWorkStatus" style="font-size:13px; opacity:0.8;"></span>

<label>เรียงลำดับผลงาน</label>
<select id="workSortMode" onchange="applyWorkSortAndRender()">
  <option value="latest">ส่งล่าสุดก่อน</option>
  <option value="oldest">ส่งก่อนสุดก่อน</option>
  <option value="noAsc">เลขที่น้อยไปมาก</option>
  <option value="noDesc">เลขที่มากไปน้อย</option>
  <option value="nameAsc">ชื่อนักเรียน ก-ฮ</option>
  <option value="groupAsc">ชื่อกลุ่ม ก-ฮ</option>
</select>

<button type="button" onclick="sortCurrentWorkSheet()">
  🔃 เรียงในชีต
</button>

  <div id="workStatus"></div>
  <div id="work"></div>
<hr class="panel-divider">

<h2>ตารางคะแนนรายงาน</h2>

<div class="score-toolbar">

  <select id="scoreLevel">
    <option value="">กำลังโหลดระดับชั้น...</option>
  </select>

  <select id="scoreClass">
    <option value="">ทุกห้อง</option>
  </select>

  <button onclick="loadScoreTable()">
    โหลดตารางคะแนน
  </button>

</div>

<div id="scoreTableStatus"></div>

<div class="score-tools">

  <label class="hide-score-box">
    <input
      type="checkbox"
      id="hideScoresToggle"
      onchange="toggleHideScores()"
    >
    ซ่อนคะแนนในตาราง
  </label>

  <div class="score-tools-row">

    <select id="bulkAssignment">
  <option value="">เลือกงานที่ต้องการให้คะแนน</option>
</select>

<input
  id="bulkScore"
  type="number"
  placeholder="คะแนน"
>

<button onclick="selectScoreCellsByAssignment()">
  เลือกทั้งหมดในงานนี้
</button>

<button onclick="applyScoreToSelectedCells()">
  ใส่คะแนนให้ช่องที่เลือก
</button>

<button onclick="clearSelectedScoreCells()">
  ยกเลิกทั้งหมด
</button>
  

  </div>

  <button class="toolbar-button" onclick="saveAllScoreChanges()">
    บันทึกคะแนนทั้งหมดลงชีตงาน
  </button>

  <div id="bulkScoreStatus"></div>

</div>

<div id="scoreTableWrap" class="score-table-wrap"></div>
<button class="toolbar-button" onclick="exportScoreSummary()">
  บันทึกตารางคะแนนลง Sheet
</button>
<button class="toolbar-button" onclick="downloadScoreTableImage()">
  บันทึกตารางเป็นรูปภาพ
</button>

<div id="exportSummaryStatus"></div>
</div>


<div id="studentPanel" class="panel">

  <h2>Student Dashboard</h2>

  <div id="studentData"></div>
  <div class="status-box">
  <h3>ส่งงานผ่านเว็บ</h3>

  <select id="submitTopic" onchange="handleSubmitTopicChange()">
    <option value="">กำลังโหลดหัวข้องาน...</option>
  </select>

  <div id="submitModeBox" style="display:none;">
  <label>เลือกรูปแบบการส่ง</label>

  <select id="submitMode">
    <option value="งานเดี่ยว">ส่งเดี่ยว</option>
    <option value="งานกลุ่ม">ส่งกลุ่ม</option>
  </select>
</div>
  <textarea
    id="submitWorkText"
    placeholder="พิมพ์คำตอบ หรือวางลิงก์งาน/ลิงก์รูป"
    style="width:100%;height:120px;margin-top:10px;background:black;color:#00ff41;border:1px solid #00ff41;"
  ></textarea>
<input
  id="submitFile"
  type="file"
  accept="image/*,.pdf,.doc,.docx,.ppt,.pptx"
/>
  <button onclick="submitStudentWork()">
    ส่งงาน
  </button>

<script>

// ใช้ API URL เดิมของคุณ
const API_URL =
  "https://script.google.com/macros/s/AKfycbyAT7_07ovIoc2Q5RwYmU2Jldml0T7_nzlkdnlkhHwj8g3tRjixpwx_xTH-tV2JJ5O7zg/exec";

let currentWorkData = [];
let currentSheetUrl = "";
let autoRefreshWorkTimer = null;
let currentStudentId = "";
let currentStudentName = "";
let currentStudentLevel = "";
let currentStudentClass = "";
let currentStudentNo = "";
let scoreOptionsData = [];
let lastScoreTableData = null;
let hideScoreValues = false;
let changedScoreMap = {};

// ======================================
// LOGIN
// ======================================
function login(){

  const id = document
    .getElementById("id")
    .value
    .trim();

  const pass = document
    .getElementById("pass")
    .value
    .trim();

  const msg = document.getElementById("msg");

  if(!id || !pass){
    msg.innerHTML = "❌ กรุณากรอก ID และ Password";
    return;
  }

  msg.innerHTML = "กำลังเข้าสู่ระบบ...";

  fetch(
    API_URL
    + "?action=login"
    + "&id=" + encodeURIComponent(id)
    + "&pass=" + encodeURIComponent(pass)
  )

  .then(res => res.json())

  .then(data => {

    if(data.status === "success"){

      document
        .getElementById("loginBox")
        .style.display = "none";

      if(String(data.role).trim() === "teacher"){

        document
          .getElementById("teacherPanel")
          .style.display = "block";

        loadTopics();
        startAutoRefreshWork();
        loadScoreOptions();
      }

      else{

currentStudentId = data.id;
currentStudentName = data.name;
currentStudentLevel = data.level || "";
currentStudentClass = data.className || "";
currentStudentNo = data.no || "";

  document
    .getElementById("studentPanel")
    .style.display = "block";

  document
    .getElementById("studentData")
    .innerHTML =
    `<div class="status-box">
      ยินดีต้อนรับ ${escapeHtml(data.name)}
    </div>`;

  loadMyWork();
  loadSubmitTopics();
}
    }

    else{
      msg.innerHTML =
        "❌ " + escapeHtml(data.message || "Login Failed");
    }
  })

  .catch(error => {
    console.error(error);
    msg.innerHTML = "❌ เชื่อมต่อ API ไม่สำเร็จ";
  });
}


// ======================================
// โหลดหัวข้องาน
// ======================================
function loadTopics(){

  const topicSelect = document.getElementById("topic");

  topicSelect.innerHTML =
    `<option value="">กำลังโหลดหัวข้องาน...</option>`;

  fetch(API_URL + "?action=topics")

  .then(res => res.json())

  .then(response => {

    let topics = [];

    // รองรับ API เวอร์ชันใหม่
    if(
      response &&
      response.status === "success" &&
      Array.isArray(response.data)
    ){
      topics = response.data;
    }

    // รองรับ API เก่าที่ส่ง array ตรง ๆ
    else if(Array.isArray(response)){
      topics = response;
    }

    else{
      topicSelect.innerHTML =
        `<option value="">โหลดหัวข้องานไม่สำเร็จ</option>`;

      console.log("Topics API Response:", response);
      return;
    }

    if(topics.length === 0){
      topicSelect.innerHTML =
        `<option value="">ยังไม่มีหัวข้องาน</option>`;
      return;
    }

    let html =
      `<option value="">-- เลือกหัวข้องาน --</option>`;

    topics.forEach(t => {

      html += `
        <option
  value="${escapeAttribute(t.url)}"
data-work-type="${escapeAttribute(t.workType || "งานเดี่ยว")}"
>
  ${escapeHtml(t.level)} - ${escapeHtml(t.topic)}
${t.workType === "งานกลุ่ม" ? " [งานกลุ่ม]" : ""}
${t.workType === "เลือกส่ง" ? " [เลือกส่ง]" : ""}
</option>
      `;
    });

    topicSelect.innerHTML = html;
  })

  .catch(error => {
    console.error(error);
    topicSelect.innerHTML =
      `<option value="">โหลดหัวข้องานไม่สำเร็จ</option>`;
  });
}

function refreshWorkList(){

  const status =
    document.getElementById("refreshWorkStatus");

  if(status){
    status.textContent = "กำลังรีเฟรช...";
  }

  loadWork();

  setTimeout(() => {
    if(status){
      const now = new Date();

      status.textContent =
        "อัปเดตล่าสุด " +
        now.toLocaleTimeString("th-TH", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
    }
  }, 800);
}
function startAutoRefreshWork(){

  if(autoRefreshWorkTimer){
    clearInterval(autoRefreshWorkTimer);
  }

  autoRefreshWorkTimer = setInterval(() => {

    const topicSelect =
      document.getElementById("topic");

    if(!topicSelect || !topicSelect.value){
      return;
    }

    refreshWorkList();

  }, 30000);
}
// ======================================
// โหลดงานนักเรียน
// ======================================
function loadWork(){

  const url = document
    .getElementById("topic")
    .value;

  const workBox = document.getElementById("work");
  const workStatus = document.getElementById("workStatus");

  if(!url){
    workStatus.innerHTML =
      `<div class="status-box">❌ กรุณาเลือกหัวข้องานก่อน</div>`;
    workBox.innerHTML = "";
    return;
  }

  currentSheetUrl = url;

  workStatus.innerHTML =
    `<div class="status-box">กำลังโหลดงาน...</div>`;

  workBox.innerHTML = "";

  fetch(
    API_URL
    + "?action=studentWork"
    + "&url="
    + encodeURIComponent(url)
  )

  .then(res => res.json())

  .then(response => {

    let data = [];

    // API ใหม่
    if(
      response &&
      response.status === "success" &&
      Array.isArray(response.data)
    ){
      data = response.data;
    }

    // เผื่อ API เก่าที่ยังส่ง array ตรง ๆ
    else if(Array.isArray(response)){
      data = response;
    }

    else{
      workStatus.innerHTML =
        `<div class="status-box">
          ❌ โหลดงานไม่สำเร็จ:
          ${escapeHtml(response.message || "รูปแบบข้อมูลจาก API ไม่ถูกต้อง")}
        </div>`;

      console.log("StudentWork API Response:", response);
      return;
    }

    currentWorkData = data;

    if(currentWorkData.length === 0){

      workStatus.innerHTML =
        `<div class="status-box">ยังไม่มีข้อมูลงานนักเรียนในชีทนี้</div>`;

      return;
    }

    populateClassFilter(currentWorkData);

    workStatus.innerHTML =
      `<div class="status-box">
        พบงานทั้งหมด ${currentWorkData.length} รายการ
      </div>`;

    applyWorkSortAndRender();
  })

  .catch(error => {

    console.error(error);

    workStatus.innerHTML =
      `<div class="status-box">
        ❌ เกิดข้อผิดพลาดในการเชื่อมต่อ API
      </div>`;
  });
}


// ======================================
// สร้างตัวเลือกห้องเรียน
// ======================================
function populateClassFilter(data){

  const classSelect = document.getElementById("classFilter");

  const classes = [
    ...new Set(
      data
        .map(item => String(item.class || "").trim())
        .filter(Boolean)
    )
  ];

  let html = `<option value="">ทุกห้อง</option>`;

  classes.forEach(className => {
    html += `
      <option value="${escapeAttribute(className)}">
        ${escapeHtml(className)}
      </option>
    `;
  });

  classSelect.innerHTML = html;

  classSelect.onchange = renderWorkCards;
  document.getElementById("noFilter").oninput = renderWorkCards;
}


// ======================================
// แสดงการ์ดงาน พร้อมกรองห้อง/เลขที่
// ======================================
function applyWorkSortAndRender(){
  renderWorkCards();
}


function getSortedWorkData(data){

  const sortSelect =
    document.getElementById("workSortMode");

  const sortMode =
    sortSelect ? sortSelect.value : "latest";

  const sorted =
    [...data];

  sorted.sort((a, b) => {

    if(sortMode === "latest"){
      return getTimeValue(b.timestamp) - getTimeValue(a.timestamp);
    }

    if(sortMode === "oldest"){
      return getTimeValue(a.timestamp) - getTimeValue(b.timestamp);
    }

    if(sortMode === "noAsc" || sortMode === "noDesc"){
      const aIsGroup = isGroupWorkItem(a);
      const bIsGroup = isGroupWorkItem(b);

      if(aIsGroup !== bIsGroup){
        return aIsGroup ? 1 : -1;
      }

      return sortMode === "noAsc"
        ? getNoValue(a.no) - getNoValue(b.no)
        : getNoValue(b.no) - getNoValue(a.no);
    }

    if(sortMode === "nameAsc"){
      return getStudentDisplayName(a)
        .localeCompare(
          getStudentDisplayName(b),
          "th",
          { numeric: true }
        );
    }

    if(sortMode === "groupAsc"){
      return getGroupDisplayName(a)
        .localeCompare(
          getGroupDisplayName(b),
          "th",
          { numeric: true }
        );
    }

    return 0;
  });

  return sorted;
}


function getTimeValue(value){

  const time =
    new Date(value).getTime();

  return isNaN(time) ? 0 : time;
}


function getNoValue(value){

  const number =
    parseInt(value, 10);

  return isNaN(number) ? 999999 : number;
}


function isGroupWorkItem(item){

  return item.isGroup === true ||
    String(item.submitMode || "").trim() === "งานกลุ่ม" ||
    String(item.groupName || "").trim() !== "";
}


function getStudentDisplayName(item){

  return String(
    item.name ||
    item.studentName ||
    ""
  ).trim();
}


function getGroupDisplayName(item){

  if(isGroupWorkItem(item)){
    return String(item.groupName || "").trim();
  }

  return "\uffff";
}


function sortCurrentWorkSheet(){

  const topicSelect =
    document.getElementById("topic");

function renderWorkCards(){

  const workBox = document.getElementById("work");

    document
    .getElementById("classFilter")
    .value;

  const selectedNo =
    document
    .getElementById("noFilter")
    .value
    .trim();

  const sortedWorkData =
    getSortedWorkData(currentWorkData);

  let html = "";
  let visibleCount = 0;

  sortedWorkData.forEach(s => {

    const studentClass = String(s.class || "").trim();
    const studentNo = String(s.no || "").trim();

    const isGroup =
      isGroupWorkItem(s);

    const displayTitle =
      isGroup
        ? String(s.groupName || "ไม่ระบุชื่อกลุ่ม").trim()
        : String(s.name || "-").trim();

    const displayDetail =
      isGroup

        : "เลขที่: " + String(studentNo || "-").trim();

    if(
      selectedClass &&
      studentClass !== selectedClass
    ){
      return;
    }

    if(
      selectedNo &&
      !isGroup &&
      studentNo !== selectedNo

    }

    if(
      selectedNo &&
      isGroup

      return;
    }

    visibleCount++;

      s.work !== undefined
      ? s.work
      : (s.image !== undefined ? s.image : "");

    html += `

      <div class="card">

        <h3>
          ${escapeHtml(studentClass)}
          ${isGroup ? "งานกลุ่ม" : escapeHtml("เลขที่ " + studentNo)}

          </div>

          ${
            s.dueDate
            ? `
              <div class="due-date">
                กำหนดส่งของห้องนี้:
                ${escapeHtml(formatTimestamp(s.dueDate))}
              </div>
            `
            : ``
          }
        </div>

        <div class="work-box">
          <h4>งานที่ส่ง</h4>
          ${renderWorkContent(workValue)}
        </div>

        <div class="score-area">

          <input
            type="number"
            id="score_${escapeAttribute(s.rowIndex || s.id)}"
            value="${escapeAttribute(s.score || "")}"
            placeholder="คะแนน"
          >

          <button
            onclick="saveScore(
              '${escapeJsString(currentSheetUrl)}',
              '${escapeJsString(s.id || "")}',

      </div>
    `;
  });

  if(visibleCount === 0){
    html =
      `<div class="status-box">ไม่พบข้อมูลตามตัวกรอง</div>`;
  }

  workBox.innerHTML = html;

// ======================================
// แสดงงานในช่อง Work
// ถ้าเป็น Drive URL = พรีวิวไฟล์
// ถ้าเป็น image URL โดยตรง = แสดงรูป
// ถ้าเป็น URL ทั่วไป = แสดงลิงก์
// ถ้าไม่ใช่ URL = แสดงข้อความ
// ======================================
function renderWorkContent(work){

  const value = String(work || "").trim();

  if(!value){
    return `<p class="empty-text">ยังไม่มีข้อมูลงานที่ส่ง</p>`;
  }

  const driveFileId = extractDriveFileId(value);

  if(driveFileId){

    const previewUrl =
      "https://drive.google.com/file/d/"
      + driveFileId
      + "/preview";

    return `
      <iframe
        class="drive-preview"
        src="${escapeAttribute(previewUrl)}"
        allow="autoplay"
      ></iframe>

      <a
        class="file-link"
        href="${escapeAttribute(value)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        เปิดไฟล์ในแท็บใหม่
      </a>
    `;
  }

  if(isDirectImageUrl(value)){

    return `
      <img
        class="direct-image"
        src="${escapeAttribute(value)}"
        alt="Student work"
        onerror="this.outerHTML='<p>❌ ไม่สามารถแสดงรูปได้</p>';"
      >
    `;
  }

  if(isUrl(value)){

    return `
      <a
        class="file-link"
        href="${escapeAttribute(value)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        เปิดลิงก์งาน
      </a>
    `;
  }

  return `
    <div class="text-work">
      ${escapeHtml(value)}
    </div>
  `;
}

// ======================================
// แยก FILE ID จากลิงก์ Google Drive
// รองรับ:
// - open?id=...
// - /file/d/.../view
// - uc?id=...
// ======================================
function extractDriveFileId(url){

  const value = String(url || "").trim();

  const matchById =
    value.match(/[?&]id=([a-zA-Z0-9_-]+)/);

  if(matchById && matchById[1]){
    return matchById[1];
  }

  const matchByD =
    value.match(/\/d\/([a-zA-Z0-9_-]+)/);

  if(matchByD && matchByD[1]){
    return matchByD[1];
  }

  return "";
}


// ======================================
// ตรวจ URL
// ======================================
function isUrl(value){
  return /^https?:\/\/\S+$/i.test(String(value || "").trim());
}


// ======================================
// ตรวจ direct image url
// ======================================
function isDirectImageUrl(value){
  return /^https?:\/\/\S+\.(png|jpg|jpeg|gif|webp|bmp|svg)(\?\S*)?$/i
    .test(String(value || "").trim());
}


// ======================================
// ป้องกัน HTML แตก
// ======================================
function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttribute(value){
  return escapeHtml(value);
}

function escapeJsString(value){

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"')
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");
}
// ======================================
// จัดรูปแบบวันและเวลาส่งงาน
// ======================================
function formatTimestamp(value){

  if(!value){
    return "-";
  }

  const date = new Date(value);

  if(isNaN(date.getTime())){
    return String(value);
  }

  return new Intl.DateTimeFormat("th-TH", {
    timeZone: "Asia/Bangkok",
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  }).format(date);
}

function renderEditableScoreCell(cell, assignmentIndex){

  const status = cell.status || "missing";
  const score = cell.score ?? "";
  const rowIndex = cell.rowIndex || "";
  const studentId = cell.studentId || "";
  const sheetUrl = cell.sheetUrl || "";

  const key =
    sheetUrl + "|" + rowIndex + "|" + studentId + "|" + assignmentIndex;

  if(
    hideScoreValues &&
    status === "scored"
  ){
    return `<span class="hidden-score">••••</span>`;
  }

  if(
    status === "scored" ||
    status === "pending"
  ){
    return `
      <div class="select-score-box">

        <input
          type="checkbox"
          class="score-check"
          data-input-id="score_input_${escapeAttribute(key)}"
          onchange="toggleScoreCellSelected(this)"
        >

        <div>
          <input
            id="score_input_${escapeAttribute(key)}"
            class="score-input"
            type="number"
            value="${escapeAttribute(score)}"
            placeholder="${status === "pending" ? (cell.isLate ? "ส่งช้า/รอตรวจ" : "รอตรวจ") : ""}"
            data-key="${escapeAttribute(key)}"
            data-url="${escapeAttribute(sheetUrl)}"
            data-row-index="${escapeAttribute(rowIndex)}"
            data-student-id="${escapeAttribute(studentId)}"
            data-assignment-index="${escapeAttribute(assignmentIndex)}"
            onchange="markScoreChanged(this)"
          >

          ${
            cell.isLate
            ? `<div class="score-late">ส่งช้า</div>`
            : ``
          }
        </div>

      </div>
    `;
  }

  if(status === "error"){
    return `<span class="score-error">เปิดชีตไม่ได้</span>`;
  }

  return `<span class="score-missing">ยังไม่ส่ง</span>`;
}

  ];

    ];

function getScoreTextForImage(cell){

  if(!cell){
    return "ยังไม่ส่ง";
  }

  if(cell.status === "scored"){

    const scoreValue =
      Number(cell.score);

    if(scoreValue === 0){
      return cell.isLate
        ? "รอแก้ไข (ส่งช้า)"
        : "รอแก้ไข";
    }

    return cell.isLate
      ? "ตรวจแล้ว (ส่งช้า)"
      : "ตรวจแล้ว";
  }

  if(cell.status === "pending"){
    return cell.isLate
      ? "รอตรวจ (ส่งช้า)"
      : "รอตรวจ";
  }

  if(cell.status === "error"){
    return "เปิดชีตไม่ได้";
  }

  return "ยังไม่ส่ง";
}


function drawTableImage(headers, rows){

  const padding = 18;
  const rowHeight = 42;
  const fontSize = 18;
  const titleHeight = 60;

  const colWidths = headers.map((header, colIndex) => {

    let maxLength = String(header).length;

    rows.forEach(row => {
      maxLength = Math.max(
        maxLength,
        String(row[colIndex] || "").length
      );
    });

    return Math.min(
      Math.max(maxLength * 12 + 30, 90),
      260
    );
  });

  const tableWidth =
    colWidths.reduce((sum, w) => sum + w, 0);

  const canvas = document.createElement("canvas");

  canvas.width = tableWidth + padding * 2;
  canvas.height =
    titleHeight +
    rowHeight * (rows.length + 1) +
    padding * 2;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#000000";
  ctx.font = "bold 22px Arial";
  ctx.fillText(
    "ตารางคะแนนรายงาน",
    padding,
    38
  );

  ctx.font = `${fontSize}px Arial`;
  ctx.strokeStyle = "#000000";
  ctx.lineWidth = 1;

  let y = titleHeight;

  drawImageRow(ctx, headers, colWidths, padding, y, rowHeight, true);

  y += rowHeight;

  rows.forEach(row => {
    drawImageRow(ctx, row, colWidths, padding, y, rowHeight, false);
    y += rowHeight;
  });

  const link = document.createElement("a");

  const level =
    document.getElementById("scoreLevel").value || "score";

  const className =
    document.getElementById("scoreClass").value || "all";

  link.download =
    "ScoreTable_" +
    level.replace(/[^\wก-๙]/g, "") +
    "_" +
    className.replace(/[^\wก-๙]/g, "") +
    ".png";

  link.href = canvas.toDataURL("image/png");
  link.click();
}


function drawImageRow(ctx, row, colWidths, x, y, rowHeight, isHeader){

  let currentX = x;

  row.forEach((cell, index) => {

    ctx.fillStyle = isHeader ? "#e6e6e6" : "#ffffff";
    ctx.fillRect(currentX, y, colWidths[index], rowHeight);

    ctx.strokeStyle = "#000000";
    ctx.strokeRect(currentX, y, colWidths[index], rowHeight);

    ctx.fillStyle = "#000000";
    ctx.font = isHeader ? "bold 18px Arial" : "18px Arial";

    const text = String(cell || "");

    ctx.fillText(
      text.length > 22 ? text.substring(0, 22) + "..." : text,
      currentX + 8,
      y + 27
    );

    currentX += colWidths[index];
  });
}

if(workType === "เลือกส่ง"){

else if(workType === "งานกลุ่ม"){

    canvas.height
  );

  ctx.fillStyle =
    "#00ff41";

  ctx.font =
    fontSize + "px monospace";

  for(let i = 0; i < drops.length; i++){

    const text =
      letters[
        Math.floor(
          Math.random() * letters.length
        )
      ];

    ctx.fillText(
      text,
      i * fontSize,
      drops[i] * fontSize
    );

    if(
      drops[i] * fontSize > canvas.height &&
      Math.random() > 0.975
    ){
      drops[i] = 0;
    }

    drops[i]++;
  }
}

setInterval(draw, 33);

window.addEventListener("resize", () => {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

  initMatrix();
});

</script>

</body>
</html>
